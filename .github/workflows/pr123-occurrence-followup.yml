name: PR 123 occurrence follow-up

on:
  push:
    branches:
      - refactor/admin-v2

permissions:
  contents: write

jobs:
  apply-followup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refactor/admin-v2
          fetch-depth: 0

      - name: Install shared-layer dependencies
        run: npm ci --prefix lambdas/shared-layer/nodejs

      - name: Apply occurrence follow-up
        run: python3 .github/scripts/pr123_occurrence_followup.py

      - name: Validate follow-up
        run: |
          git diff --check
          node --check lambdas/scouts-slack-handler/function/slack-handler.mjs
          node --check lambdas/scouts2sqs/function/request-router.mjs
          node --check lambdas/shared-layer/nodejs/event-review.mjs
          node --test lambdas/shared-layer/nodejs/event-review.test.mjs
          node --test tests/issue-94-admin-slack-sync.integration.test.mjs
          node --test lambdas/sqs2scouts/function/tests/test-full-enrich-helpers.mjs

      - name: Commit follow-up and remove one-shot tooling
        run: |
          git rm .github/workflows/pr123-occurrence-followup.yml .github/scripts/pr123_occurrence_followup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lambdas/scouts-slack-handler/function/slack-handler.mjs \
            lambdas/scouts2sqs/function/request-router.mjs \
            lambdas/shared-layer/nodejs/event-review.mjs \
            lambdas/shared-layer/nodejs/event-review.test.mjs \
            tests/issue-94-admin-slack-sync.integration.test.mjs
          git commit -m "Make Slack visibility occurrence-scoped"
          git push origin HEAD:refactor/admin-v2
