name: Issue 122 controller cleanup

on:
  push:
    branches:
      - fix/issue-122-controller-ownership
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-122-controller-ownership
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install shared test dependencies
        run: npm ci --prefix lambdas/shared-layer/nodejs
      - name: Apply controller ownership cleanup
        run: |
          python scripts/issue-122-controller-cleanup.py
          python scripts/issue-122-controller-cleanup-fixes.py
          python scripts/issue-122-controller-cleanup-fixes-2.py
      - name: Validate Admin v2 changes
        run: |
          node --check website/admin/admin-script.js
          node --check website/admin/private-storage-client.js
          node --check website/admin/admin-approval-workflow.js
          node --check website/admin/admin-simplify.js
          node --check website/admin/admin-agenda-refresh.js
          node --check website/admin/admin-diagnostics-enhancements.js
          node --check website/admin/admin-activity-centre.js
          node --test \
            tests/issue-122-controller-ownership.test.mjs \
            tests/issue-39-admin-actions.test.mjs \
            tests/issue-91-presentation.test.mjs \
            tests/issue-34-admin-ui.integration.test.mjs \
            tests/issue-43-dlq-admin-enhancements.test.mjs \
            tests/deployment-order.integration.test.mjs
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add website/admin tests
          git commit -m "refactor: consolidate Admin v2 controller ownership"
          git push origin HEAD:fix/issue-122-controller-ownership
