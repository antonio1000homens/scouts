name: Issue 122 controller cleanup

on:
  push:
    branches:
      - fix/issue-122-controller-ownership
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-122-controller-ownership
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply controller ownership cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label, flags=re.S):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 replacement, got {count}')
              return updated

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 occurrence, got {count}')
              return text.replace(old, new, 1)

          # Core controller keeps stable global entry points and delegates to explicit owners.
          path = Path('website/admin/admin-script.js')
          text = path.read_text()
          text = sub_once(text,
              r"async function sendScoutsCommand\(payload, options = \{\}\) \{.*?\n\}\n\nasync function sendScoutsReadCommand\(payload, options = \{\}\) \{.*?\n\}",
              '''async function sendScoutsCommand(payload, options = {}) {
    const timeoutMs = Number.isFinite(options.timeoutMs) ? options.timeoutMs : ADMIN_WRITE_TIMEOUT_MS;
    const readOnly = options.readOnly === true;
    try {
        const response = await fetchJsonWithTimeout(SCOUTS_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain',
            },
            credentials: 'same-origin',
            body: JSON.stringify(payload),
        }, timeoutMs);

        if (!response.ok) {
            throw await buildHttpError(response);
        }

        let result;
        try {
            const parsed = await response.json();
            if (parsed && typeof parsed === 'object') {
                parsed._httpStatus = response.status;
                const requestId = extractBackendRequestId(parsed);
                if (requestId) updateRuntimeRequestId(requestId);
                result = parsed;
            } else {
                result = { value: parsed, _httpStatus: response.status };
            }
        } catch {
            result = { _httpStatus: response.status };
        }

        if (!readOnly && payload?.realm !== 'runtime') {
            window.adminActivityController?.trackAcceptedMutation?.(payload, result);
        }
        return result;
    } catch (error) {
        if (!readOnly && error?.code === 'ADMIN_API_TIMEOUT') {
            window.adminActivityController?.scheduleNearTerm?.(0);
        }
        throw error;
    }
}

async function sendScoutsReadCommand(payload, options = {}) {
    return sendScoutsCommand(payload, {
        ...options,
        readOnly: true,
        timeoutMs: options.timeoutMs ?? ADMIN_READ_TIMEOUT_MS,
    });
}''',
              'transport ownership')

