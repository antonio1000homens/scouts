          """
              new = f"""    const eventLabel = event.summary || event.title || `Event ${{eventIndex + 1}}`;
              const hex = getEventHex(event);
              const occurrenceId = entry.occurrenceId || event.occurrenceId;
              if (!occurrenceId) {{
                  const message = 'Cannot {verb} event: this occurrence has no canonical identity. Refresh the agenda and try again.';
                  if (fromModal) updateModalStatus(message, 'error'); else updateRuntimeDetails(message, 'error');
                  return;
              }}
              if (!hex) {{
                  const message = 'Cannot {verb} event: missing HEX.';
                  if (fromModal) updateModalStatus(message, 'error');
