              if (button) {{ button.disabled = true; button.textContent = '{label}'; }}

              refreshApiActionButtons();
          """,
                  f"""    const originalButtonLabel = button?.textContent;
              if (button) {{
                  button.dataset.apiPending = 'true';
                  button.disabled = true;
                  button.textContent = '{label}';
              }}

              refreshApiActionButtons();
          """,
              )

          # There are exactly two visibility finally blocks with this shape.
          p = Path('website/admin/admin-script.js')
          text = p.read_text()
          old = """        if (button) { button.disabled = !apiAuthReady; button.textContent = originalButtonLabel; }
                  pendingUiOperations.delete(operationKey);
                  refreshApiActionButtons();
          """
          if text.count(old) != 2:
              raise SystemExit(f'visibility finalizer: expected 2 matches, found {text.count(old)}')
          new = """        pendingUiOperations.delete(operationKey);
                  if (button) {
                      delete button.dataset.apiPending;
                      button.textContent = originalButtonLabel;
                  }
                  refreshApiActionButtons();
          """
          p.write_text(text.replace(old, new))

          # Approval override receives the clicked button and participates in pending-state guard.
          replace_once(
              'website/admin/admin-approval-workflow.js',
              """    window.approveEvent = async function issue91ApproveEvent(eventIndex, fromModal = false, action = 'approve') {
                  if (String(action || '').toLowerCase() !== 'approve') {
                      return legacyApproveEvent?.(eventIndex, fromModal, action);
                  }
          """,
              """    window.approveEvent = async function issue91ApproveEvent(eventIndex, fromModal = false, action = 'approve', button = null) {
                  if (String(action || '').toLowerCase() !== 'approve') {
                      return legacyApproveEvent?.(eventIndex, fromModal, action, button);
                  }
          """,
