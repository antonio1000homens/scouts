          # Validate HEX before marking visibility operation pending; preserve button lock.
          for action_name, verb in [('hide', 'hide'), ('unhide', 'unhide')]:
              old = f"""    const eventLabel = event.summary || event.title || `Event ${{eventIndex + 1}}`;
              const hex = getEventHex(event);
              const occurrenceId = entry.occurrenceId || event.occurrenceId;
              if (!occurrenceId) {{
