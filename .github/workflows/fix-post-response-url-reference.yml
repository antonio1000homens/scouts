name: Apply persistence hotfix

on:
  push:
    branches:
      - fix/post-response-url-reference

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/post-response-url-reference
          fetch-depth: 0

      - name: Apply callback binding fix
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            lambdas/sqs2scouts/function/persistence-processor.mjs \
            lambdas/sqs2scouts/function/approval-lifecycle-adapter.mjs
          do
            perl -0pi -e 's/^(\s*)postResponseUrl,\s*$/${1}postResponseUrl: postToResponseUrl,/mg' "$file"
          done
          if grep -R -n -E '^\s*postResponseUrl,$' lambdas/sqs2scouts/function/persistence-processor.mjs lambdas/sqs2scouts/function/approval-lifecycle-adapter.mjs; then
            echo 'Unbound postResponseUrl callback remains' >&2
            exit 1
          fi
          grep -n 'postResponseUrl: postToResponseUrl' lambdas/sqs2scouts/function/persistence-processor.mjs lambdas/sqs2scouts/function/approval-lifecycle-adapter.mjs

      - name: Add regression test
        shell: bash
        run: |
          set -euo pipefail
          marker='Slack response URL callback bindings use the defined helper in both persistence paths'
          if ! grep -Fq "$marker" tests/issue-94-admin-slack-sync.integration.test.mjs; then
            cat >> tests/issue-94-admin-slack-sync.integration.test.mjs <<'EOF'

          test('Slack response URL callback bindings use the defined helper in both persistence paths', () => {
            const persistenceProcessor = readFileSync('lambdas/sqs2scouts/function/persistence-processor.mjs', 'utf8');
            const approvalAdapter = readFileSync('lambdas/sqs2scouts/function/approval-lifecycle-adapter.mjs', 'utf8');
            for (const source of [persistenceProcessor, approvalAdapter]) {
              assert.match(source, /async function postToResponseUrl\(/);
              assert.match(source, /postResponseUrl: postToResponseUrl/);
              assert.doesNotMatch(source, /\n\s*postResponseUrl,\n/);
            }
          });
          EOF
          fi

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          node --check lambdas/sqs2scouts/function/persistence-processor.mjs
          node --check lambdas/sqs2scouts/function/approval-lifecycle-adapter.mjs
          node --test tests/issue-94-admin-slack-sync.integration.test.mjs

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lambdas/sqs2scouts/function/persistence-processor.mjs lambdas/sqs2scouts/function/approval-lifecycle-adapter.mjs tests/issue-94-admin-slack-sync.integration.test.mjs
          git commit -m 'Fix Slack response URL callback binding'
          git push origin HEAD:fix/post-response-url-reference
