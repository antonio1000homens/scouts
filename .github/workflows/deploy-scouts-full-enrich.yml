name: Deploy Scouts Full Enrich POC

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'lambdas/scouts-full-enrich/**'
      - 'lambdas/cloudformation/templates/scouts-full-enrich.yaml'
      - '.github/workflows/deploy-scouts-full-enrich.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  EXPECTED_AWS_ACCOUNT: '553490163883'
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  CLOUDFORMATION_ROLE_ARN: ${{ vars.CLOUDFORMATION_ROLE_ARN }}

jobs:
  deploy-scouts-full-enrich:
    runs-on: ubuntu-latest
    concurrency:
      group: scouts-full-enrich-stack-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-scouts-full-enrich
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy scouts full-enrich POC state machine
        env:
          CLOUDFORMATION_ROLE_ARN: ${{ env.CLOUDFORMATION_ROLE_ARN }}
          EXPECTED_AWS_ACCOUNT: ${{ env.EXPECTED_AWS_ACCOUNT }}
        run: cd lambdas/scouts-full-enrich && bash ./deploy.sh
