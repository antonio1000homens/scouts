name: Apply issue 94 implementation

on:
  push:
    branches:
      - issue-94-sync-admin-slack

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          sync_module = r'''function text(value) {
            if (value === undefined || value === null) return '';
            return String(value).trim();
          }

          function clone(value) {
            if (!value || typeof value !== 'object') return {};
            return JSON.parse(JSON.stringify(value));
          }

          function getCanonicalStatus(event) {
            const metadataStatus = event?.metadata?.status;
            if (metadataStatus && typeof metadataStatus === 'object') {
              return {
                isApproved: metadataStatus.isApproved === true,
                isHidden: metadataStatus.isHidden === true,
              };
            }
            return {
              isApproved: event?.isApproved === true || event?.approved === true,
              isHidden: event?.isHidden === true || event?.hidden === true,
            };
          }

          export function canonicalSlackDecision(event) {
            const status = getCanonicalStatus(event);
            if (status.isHidden) {
              return { status: 'HIDDEN', label: 'Hidden', emoji: '🙈' };
            }
            if (status.isApproved) {
              return { status: 'APPROVED', label: 'Approved', emoji: '✅' };
            }
            return { status: 'VISIBLE', label: 'Visible', emoji: '👁️' };
          }

          export function buildTerminalSlackPayload(event, { hexValue = null, resolveImageUrl = (value) => value } = {}) {
            const decision = canonicalSlackDecision(event);
            const title = text(event?.title || event?.summary || event?.name) || 'Scouts event';
            const hex = text(hexValue || event?.metadata?.hex || event?.hex);
            const context = hex ? `\n*HEX:* \`${hex}\`` : '';
            const payload = {
              text: `${decision.emoji} ${decision.label}: ${title}`,
              blocks: [
                {
                  type: 'header',
                  text: {
                    type: 'plain_text',
                    text: `${decision.emoji} Event ${decision.label}: ${title}`.slice(0, 150),
                    emoji: true,
                  },
                },
                {
                  type: 'section',
                  text: {
                    type: 'mrkdwn',
                    text: `*${title}* is now *${decision.label.toLowerCase()}* in the canonical Scouts event state.${context}`,
                  },
                },
              ],
            };

            if (decision.status !== 'HIDDEN') {
              const imageUrl = text(event?.metadata?.image?.url || event?.image?.url);
              if (imageUrl) {
                const resolved = resolveImageUrl(imageUrl);
                if (resolved) {
                  payload.blocks.push({
                    type: 'image',
                    image_url: resolved,
                    alt_text: `Image for ${title}`,
                  });
                }
              }
            }

            return { decision, payload };
          }

          export async function reconcileSlackDecision({
            event,
            messageBody = {},
            identifiers = [],
            loadMetadata,
            persistMetadata,
            updateMessage,
            postResponseUrl,
            resolveImageUrl,
            logger = console,
            now = () => new Date(),
          } = {}) {
            const hexValue = text(event?.metadata?.hex || event?.hex).toLowerCase() || null;
            const { decision, payload } = buildTerminalSlackPayload(event, { hexValue, resolveImageUrl });
            const direct = messageBody?.slackMetadata && typeof messageBody.slackMetadata === 'object'
              ? messageBody.slackMetadata
              : {};

            let stored = null;
            if (typeof loadMetadata === 'function' && Array.isArray(identifiers) && identifiers.length > 0) {
              try {
                stored = await loadMetadata(identifiers, 'approval');
              } catch (error) {
                logger.warn?.('[SlackSync] Failed to load stored approval metadata', error?.message || error);
              }
            }

            const channel = text(direct.channel || stored?.channel) || null;
            const ts = text(direct.ts || stored?.ts) || null;
            const responseUrl = text(
              direct.responseUrl || direct.response_url || messageBody?.responseUrl || messageBody?.response_url,
            ) || null;
            const decisionSource = text(messageBody?.decisionSource) || (Object.keys(direct).length > 0 ? 'slack' : 'admin');
            let deliveredVia = null;

            if (channel && ts && typeof updateMessage === 'function') {
              try {
                await updateMessage(channel, ts, payload.text, payload.blocks);
                deliveredVia = 'chat.update';
              } catch (error) {
                logger.warn?.('[SlackSync] chat.update failed; persistence remains authoritative', {
                  channel,
                  ts,
                  error: error?.message || String(error),
                });
              }
            }

            if (!deliveredVia && responseUrl && typeof postResponseUrl === 'function') {
              try {
                await postResponseUrl(responseUrl, { replace_original: true, ...payload });
                deliveredVia = 'response_url';
              } catch (error) {
                logger.warn?.('[SlackSync] response_url replacement failed; persistence remains authoritative', {
                  error: error?.message || String(error),
                });
              }
            }

            const metadataBase = stored || ((channel && ts) ? {
              realm: 'approval',
              channel,
              ts,
              identifiers: Array.isArray(identifiers) ? identifiers : [],
              hex: hexValue,
              event: clone(event),
            } : null);

            if (metadataBase && typeof persistMetadata === 'function') {
              try {
                await persistMetadata(metadataBase, {
                  status: decision.status,
                  decisionSource,
                  decidedAt: now().toISOString(),
                  event: clone(event),
                });
              } catch (error) {
                logger.warn?.('[SlackSync] Failed to record terminal Slack approval metadata', error?.message || error);
              }
            }

            if (!deliveredVia) {
              logger.warn?.('[SlackSync] No Slack review message could be reconciled', {
                hex: hexValue,
                metadataFound: Boolean(stored),
                hasChannelAndTs: Boolean(channel && ts),
                hasResponseUrl: Boolean(responseUrl),
                terminalStatus: decision.status,
              });
            }

            return {
              decision,
              payload,
              deliveredVia,
              metadataFound: Boolean(stored),
              channel,
              ts,
              responseUrlPresent: Boolean(responseUrl),
            };
          }
          '''
          (root / 'lambdas/sqs2scouts/function/slack-decision-sync.mjs').write_text(sync_module)

          persistence_path = root / 'lambdas/sqs2scouts/function/persistence-processor.mjs'
          persistence = persistence_path.read_text()
          import_anchor = "import { buildRuntimeRequestEntry } from './runtime-request-entry.mjs';\n"
          sync_import = "import { reconcileSlackDecision } from './slack-decision-sync.mjs';\n"
          if sync_import not in persistence:
            assert import_anchor in persistence
            persistence = persistence.replace(import_anchor, import_anchor + sync_import, 1)

          start_marker = "            // Send Slack notification without UIDs\n"
          end_marker = "            console.log(`[Persist] Successfully persisted HEX file for ${eventTitle}`);\n"
          assert start_marker in persistence and end_marker in persistence
          start = persistence.index(start_marker)
          end = persistence.index(end_marker, start)
          replacement = '''            // Reconcile the existing review card with canonical persisted state.\n            // This is deliberately best-effort: Slack failures must never roll back a successful event write.\n            const eventTitle = event.title || event.summary || event.name || 'Unknown Event';\n            const slackSyncResult = await reconcileSlackDecision({\n                event,\n                messageBody,\n                identifiers: deriveApprovalIdentifiers(event),\n                loadMetadata: loadApprovalMessageMetadata,\n                persistMetadata: persistApprovalMetadata,\n                updateMessage: updateSlackApprovalMessage,\n                postResponseUrl,\n                resolveImageUrl: resolveImageUrlForDisplay,\n                logger: console,\n            });\n\n'''
          persistence = persistence[:start] + replacement + persistence[end:]
          persistence = persistence.replace(
            "            const decisionAction = actionIsHidden || statusIsHidden ? 'hidden' : 'persisted';",
            "            const decisionAction = slackSyncResult.decision.status === 'HIDDEN' ? 'hidden' : 'persisted';",
            1,
          )
          persistence_path.write_text(persistence)

          # Ensure the new runtime module is packaged with sqs2scouts.
          deploy_path = root / 'lambdas/sqs2scouts/deploy.sh'
          deploy = deploy_path.read_text()
          package_anchor = "    runtime-request-entry.mjs \\\n    ../scouts.conf"
          if "    slack-decision-sync.mjs \\\n" not in deploy:
            assert package_anchor in deploy
            deploy = deploy.replace(
              package_anchor,
              "    runtime-request-entry.mjs \\\n    slack-decision-sync.mjs \\\n    ../scouts.conf",
              1,
            )
          deploy_path.write_text(deploy)

          # Slack action payloads are rendered snapshots and can be stale. Strip decision status
          # before queuing so only the explicit action mutates visibility/approval state.
          slack_path = root / 'lambdas/scouts-slack-handler/function/slack-handler.mjs'
          slack = slack_path.read_text()
          helper_marker = "function parseActionValue(rawValue) {\n"
          helper = r'''function stripStaleDecisionStatus(event) {
            const subject = cloneEvent(event);
            delete subject.status;
            delete subject.approved;
            delete subject.isApproved;
            delete subject.isHidden;
            delete subject.hidden;
            delete subject.hiddenAt;
            if (subject.metadata && typeof subject.metadata === 'object') {
                delete subject.metadata.status;
            }
            return subject;
          }

          '''
          if helper not in slack:
            assert helper_marker in slack
            slack = slack.replace(helper_marker, helper + helper_marker, 1)

          # Modal submission and approve both mean "persist current editable fields"; stale status is not part of that patch.
          slack = slack.replace("        subject: baseEvent,\n", "        subject: stripStaleDecisionStatus(baseEvent),\n", 1)
          slack = slack.replace(
            "                        subject: eventData,\n                        slackMetadata: {",
            "                        subject: stripStaleDecisionStatus(eventData),\n                        decisionSource: 'slack',\n                        slackMetadata: {",
            1,
          )

          hide_pattern = re.compile(
            r"                    const hidePayload = \{\n"
            r"                        realm,\n"
            r"                        subject: \{.*?\n"
            r"                        \},\n"
            r"                        action: 'hidden',\n"
            r"                        slackMetadata: \{",
            re.S,
          )
          hide_replacement = """                    const hidePayload = {\n                        realm,\n                        subject: stripStaleDecisionStatus(eventData),\n                        action: 'hidden',\n                        decisionSource: 'slack',\n                        slackMetadata: {"""
          slack, count = hide_pattern.subn(hide_replacement, slack, count=1)
          assert count == 1, f'hide payload replacement count={count}'

          # Mark modal submission as Slack-originated as well.
          modal_anchor = "        subject: stripStaleDecisionStatus(baseEvent),\n    };"
          if modal_anchor in slack:
            slack = slack.replace(
              modal_anchor,
              "        subject: stripStaleDecisionStatus(baseEvent),\n        decisionSource: 'slack',\n    };",
              1,
            )
          slack_path.write_text(slack)

          tests = r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import {
            buildTerminalSlackPayload,
            canonicalSlackDecision,
            reconcileSlackDecision,
          } from './lambdas/sqs2scouts/function/slack-decision-sync.mjs';

          function event(status = {}) {
            return {
              title: 'Synthetic Scout Event',
              metadata: {
                hex: 'abcd1234',
                image: { url: '/website/eventImages/synthetic.jpg' },
                status: {
                  isApproved: status.isApproved === true,
                  isHidden: status.isHidden === true,
                },
              },
            };
          }

          test('Admin -> Slack approval updates the stored review card and removes actions', async () => {
            const calls = [];
            const persisted = [];
            const result = await reconcileSlackDecision({
              event: event({ isApproved: true }),
              messageBody: { decisionSource: 'admin' },
              identifiers: ['abcd1234'],
              loadMetadata: async () => ({ realm: 'approval', channel: 'C123', ts: '100.200', identifiers: ['abcd1234'] }),
              persistMetadata: async (_metadata, overrides) => persisted.push(overrides),
              updateMessage: async (...args) => calls.push(args),
              postResponseUrl: async () => assert.fail('response_url should not be needed when channel+ts exist'),
              resolveImageUrl: (value) => `https://example.test/${String(value).replace(/^\//, '')}`,
            });
            assert.equal(result.decision.status, 'APPROVED');
            assert.equal(result.deliveredVia, 'chat.update');
            assert.equal(calls.length, 1);
            assert.equal(result.payload.blocks.some((block) => block.type === 'actions'), false);
            assert.equal(persisted[0].status, 'APPROVED');
            assert.equal(persisted[0].decisionSource, 'admin');
          });

          test('Admin -> Slack hide renders the canonical hidden state without action buttons', async () => {
            let updatedPayload;
            const result = await reconcileSlackDecision({
              event: event({ isApproved: true, isHidden: true }),
              identifiers: ['abcd1234'],
              loadMetadata: async () => ({ realm: 'approval', channel: 'C123', ts: '100.200', identifiers: ['abcd1234'] }),
              persistMetadata: async () => {},
              updateMessage: async (_channel, _ts, text, blocks) => { updatedPayload = { text, blocks }; },
            });
            assert.equal(result.decision.status, 'HIDDEN');
            assert.match(updatedPayload.text, /Hidden/i);
            assert.equal(updatedPayload.blocks.some((block) => block.type === 'actions'), false);
          });

          test('Unhide reconciles to a meaningful visible state when the event is not approved', () => {
            assert.equal(canonicalSlackDecision(event({ isApproved: false, isHidden: false })).status, 'VISIBLE');
            const { payload } = buildTerminalSlackPayload(event({ isApproved: false, isHidden: false }));
            assert.match(payload.text, /Visible/i);
            assert.equal(payload.blocks.some((block) => block.type === 'actions'), false);
          });

          test('Slack-originated decision can use direct channel+ts and terminal metadata is recorded', async () => {
            const persisted = [];
            const result = await reconcileSlackDecision({
              event: event({ isApproved: true }),
              messageBody: {
                decisionSource: 'slack',
                slackMetadata: { channel: 'C999', ts: '222.333', responseUrl: 'https://hooks.slack.test/response' },
              },
              identifiers: ['abcd1234'],
              loadMetadata: async () => null,
              persistMetadata: async (metadata, overrides) => persisted.push({ metadata, overrides }),
              updateMessage: async () => {},
              postResponseUrl: async () => assert.fail('chat.update succeeds first'),
            });
            assert.equal(result.deliveredVia, 'chat.update');
            assert.equal(persisted[0].metadata.channel, 'C999');
            assert.equal(persisted[0].overrides.status, 'APPROVED');
            assert.equal(persisted[0].overrides.decisionSource, 'slack');
          });

          test('Missing/deleted Slack message never fails canonical persistence reconciliation', async () => {
            let terminalMetadata = null;
            const result = await reconcileSlackDecision({
              event: event({ isHidden: true }),
              identifiers: ['abcd1234'],
              loadMetadata: async () => ({ realm: 'approval', channel: 'C404', ts: '404.404', identifiers: ['abcd1234'] }),
              persistMetadata: async (_metadata, overrides) => { terminalMetadata = overrides; },
              updateMessage: async () => { throw new Error('message_not_found'); },
              logger: { warn() {} },
            });
            assert.equal(result.deliveredVia, null);
            assert.equal(result.decision.status, 'HIDDEN');
            assert.equal(terminalMetadata.status, 'HIDDEN');
          });

          test('Retries are idempotent replacements and never create a new Slack message', async () => {
            const updates = [];
            const options = {
              event: event({ isApproved: true }),
              identifiers: ['abcd1234'],
              loadMetadata: async () => ({ realm: 'approval', channel: 'C123', ts: '1.2', identifiers: ['abcd1234'] }),
              persistMetadata: async () => {},
              updateMessage: async (...args) => updates.push(args),
            };
            const first = await reconcileSlackDecision(options);
            const second = await reconcileSlackDecision(options);
            assert.equal(first.payload.text, second.payload.text);
            assert.deepEqual(first.payload.blocks, second.payload.blocks);
            assert.equal(updates.length, 2);
          });

          test('Slack action snapshots strip stale status before they enter persistence', () => {
            const handler = readFileSync('lambdas/scouts-slack-handler/function/slack-handler.mjs', 'utf8');
            assert.match(handler, /function stripStaleDecisionStatus\(event\)/);
            assert.match(handler, /subject: stripStaleDecisionStatus\(eventData\)/);
            assert.match(handler, /subject: stripStaleDecisionStatus\(baseEvent\)/);
            assert.match(handler, /decisionSource: 'slack'/);
          });

          test('sqs2scouts deployment includes the Slack decision synchronizer module', () => {
            const deploy = readFileSync('lambdas/sqs2scouts/deploy.sh', 'utf8');
            assert.match(deploy, /slack-decision-sync\.mjs/);
          });
          '''
          (root / 'tests/issue-94-admin-slack-sync.integration.test.mjs').write_text(tests)
          PY

      - name: Run targeted tests
        run: |
          node --check lambdas/sqs2scouts/function/slack-decision-sync.mjs
          node --check lambdas/sqs2scouts/function/persistence-processor.mjs
          node --check lambdas/scouts-slack-handler/function/slack-handler.mjs
          node --test tests/issue-94-admin-slack-sync.integration.test.mjs
          node --test lambdas/sqs2scouts/test-persist-patch-merge.mjs

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/issue-94-apply.yml
          git add -A
          git commit -m "Synchronise admin and Slack event decisions"
          git push origin HEAD:issue-94-sync-admin-slack
