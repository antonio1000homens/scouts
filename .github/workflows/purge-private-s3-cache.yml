name: Purge private S3 cache

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/purge-private-s3-cache.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  WEBSITE_BUCKET: scouts-2ndtolworth-prod-553490163883
  PUBLIC_SITE_BASE_URL: https://2ndtolworth.org.uk
  # CloudFront distribution IDs are non-secret deployment identifiers. Keep the
  # emergency purge aligned with the distribution documented in CLOUDFRONT.md.
  CLOUDFRONT_DISTRIBUTION_ID: E3INLSADL3AN6C

jobs:
  purge-private-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-scouts-private-cache-purge

      - name: Verify purge target
        run: |
          set -euo pipefail
          aws cloudfront get-distribution \
            --id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --query 'Distribution.{Id:Id,Enabled:DistributionConfig.Enabled,Aliases:DistributionConfig.Aliases.Items}' \
            --output json >/dev/null

      - name: Purge formerly public private paths
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/calendar/*" "/runtime/*" "/events/*" \
            --query 'Invalidation.Id' \
            --output text

      - name: Verify anonymous access boundary
        run: |
          set -euo pipefail

          origin="https://${WEBSITE_BUCKET}.s3.${AWS_REGION}.amazonaws.com"

          status_for() {
            curl --silent --show-error --max-time 15 --max-redirs 0 \
              --output /dev/null --write-out '%{http_code}' "$1" 2>/dev/null || true
          }

          is_private_status() {
            case "$1" in
              3??|401|403|404) return 0 ;;
              *) return 1 ;;
            esac
          }

          assert_public() {
            local url="$1"
            local status
            status="$(status_for "${url}")"
            if [ "${status}" != '200' ]; then
              echo "Expected anonymous HTTP 200 for public object; got ${status}: ${url}"
              exit 1
            fi
          }

          assert_private() {
            local url="$1"
            local status
            status="$(status_for "${url}")"
            if ! is_private_status "${status}"; then
              echo "Expected anonymous access to be denied/redirected; got ${status}: ${url}"
              return 1
            fi
          }

          # The S3 origin should be private immediately after the narrowed bucket
          # policy was deployed. This proves the origin policy itself is correct.
          assert_public "${origin}/agenda.json"
          assert_private "${origin}/calendar/cubs-events.ics"
          assert_private "${origin}/runtime/scoutsQueued.json"
          assert_private "${origin}/events/6d6565742074686520706f6c696365.json"

          # CloudFront invalidation is asynchronous and the deploy role deliberately
          # does not have cloudfront:GetInvalidation. Poll the actual anonymous
          # security boundary instead of granting extra IAM solely for a waiter.
          private_paths=(
            "/calendar/cubs-events.ics"
            "/runtime/scoutsQueued.json"
            "/events/6d6565742074686520706f6c696365.json"
          )

          for attempt in $(seq 1 30); do
            all_private=true
            for path in "${private_paths[@]}"; do
              status="$(status_for "${PUBLIC_SITE_BASE_URL}${path}")"
              if ! is_private_status "${status}"; then
                all_private=false
                echo "Attempt ${attempt}: still waiting for ${path} to become private (HTTP ${status})"
              fi
            done

            if [ "${all_private}" = 'true' ]; then
              break
            fi

            if [ "${attempt}" = '30' ]; then
              echo 'Private CloudFront paths were still anonymously readable after the verification window.'
              exit 1
            fi
            sleep 10
          done

          assert_public "${PUBLIC_SITE_BASE_URL}/agenda.json"
          for path in "${private_paths[@]}"; do
            assert_private "${PUBLIC_SITE_BASE_URL}${path}"
          done
