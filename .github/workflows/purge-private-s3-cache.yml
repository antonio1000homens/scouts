name: Purge private S3 cache

on:
  push:
    branches:
      - master
      - main
    paths:
      - '.github/workflows/purge-private-s3-cache.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  WEBSITE_BUCKET: scouts-2ndtolworth-prod-553490163883
  # CloudFront distribution IDs are non-secret deployment identifiers. Keep the
  # emergency purge aligned with the distribution documented in CLOUDFRONT.md.
  CLOUDFRONT_DISTRIBUTION_ID: E3INLSADL3AN6C

jobs:
  purge-private-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-scouts-private-cache-purge

      - name: Verify purge target
        run: |
          set -euo pipefail
          aws cloudfront get-distribution \
            --id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --query 'Distribution.{Id:Id,Enabled:DistributionConfig.Enabled,GeoRestriction:DistributionConfig.Restrictions.GeoRestriction}' \
            --output json >/dev/null

      - name: Purge formerly public private paths
        run: |
          set -euo pipefail
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/calendar/*" "/runtime/*" "/events/*" \
            --query 'Invalidation.Id' \
            --output text)"

          if [ -z "${invalidation_id}" ] || [ "${invalidation_id}" = 'None' ]; then
            echo 'CloudFront did not return an invalidation ID.' >&2
            exit 1
          fi

          echo "CLOUDFRONT_INVALIDATION_ID=${invalidation_id}" >> "${GITHUB_ENV}"

      - name: Wait for private path eviction
        run: |
          set -euo pipefail
          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${CLOUDFRONT_INVALIDATION_ID}"

      - name: Verify anonymous S3 access boundary
        run: |
          set -euo pipefail

          origin="https://${WEBSITE_BUCKET}.s3.${AWS_REGION}.amazonaws.com"

          status_for() {
            curl --silent --show-error --max-time 15 --max-redirs 0 \
              --output /dev/null --write-out '%{http_code}' "$1" 2>/dev/null || true
          }

          is_private_status() {
            case "$1" in
              401|403|404) return 0 ;;
              *) return 1 ;;
            esac
          }

          assert_public() {
            local url="$1"
            local status
            status="$(status_for "${url}")"
            if [ "${status}" != '200' ]; then
              echo "Expected anonymous HTTP 200 for public object; got ${status}: ${url}"
              exit 1
            fi
          }

          assert_private() {
            local url="$1"
            local status
            status="$(status_for "${url}")"
            if ! is_private_status "${status}"; then
              echo "Expected anonymous access to be denied; got ${status}: ${url}"
              exit 1
            fi
          }

          # Verify the backing S3 policy anonymously. CloudFront itself is
          # geo-restricted to GB, so a GitHub-hosted runner outside GB cannot be
          # used as a reliable viewer-side HTTP probe. Waiting for the completed
          # invalidation above proves the old cache entries were evicted; these
          # checks prove they can no longer be refilled anonymously from S3.
          assert_public "${origin}/agenda.json"
          assert_private "${origin}/calendar/cubs-events.ics"
          assert_private "${origin}/runtime/scoutsQueued.json"
          assert_private "${origin}/events/6d6565742074686520706f6c696365.json"
