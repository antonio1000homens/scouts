name: PR127 HEX canonical follow-up

on:
  push:
    branches:
      - changes

permissions:
  contents: write

jobs:
  fix-pr127:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: changes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: |
          python3 scripts/pr127-harness-prep.py
          python3 scripts/pr127-hex-canonical-fix.py
          python3 scripts/pr127-harness-post.py
      - name: Verify targeted regressions
        run: |
          git diff --check
          node --check website/admin/admin-script.js
          node --check website/admin/admin-approval-workflow.js
          node --check lambdas/scouts/function/scouts-service.mjs
          node --check lambdas/sqs2scouts/function/persistence-processor.mjs
          node --test lambdas/sqs2scouts/function/tests/test-agenda-publisher.mjs
          node --test lambdas/sqs2scouts/function/tests/test-deployment-artifact.mjs
          node --test lambdas/sqs2scouts/function/tests/test-persistence-handler.mjs
          node --experimental-vm-modules --test lambdas/scouts/function/tests/test-api-handler.mjs
          node --test tests/issue-91-presentation.test.mjs
          node --test tests/issue-94-admin-slack-sync.integration.test.mjs
          node --test tests/issue-125-regression-safety.test.mjs
      - name: Commit follow-up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make HEX canonical for shared event state'
          git push origin HEAD:changes
