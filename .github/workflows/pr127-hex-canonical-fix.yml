name: PR127 HEX canonical follow-up

on:
  push:
    branches:
      - changes

permissions:
  contents: write

jobs:
  fix-pr127:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: changes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: |
          sed -i "s/exercises SQS messageBody occurrence hide and unhide'/exercises SQS messageBody occurrence hide and unhide boundaries'/" scripts/pr127-hex-canonical-fix.py
          python3 scripts/pr127-hex-canonical-fix.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('lambdas/sqs2scouts/function/tests/test-persistence-handler.mjs')
          text = path.read_text()
          old = """    publishCanonicalEventToAgenda: async ({ loadAgenda, writeAgenda, occurrenceId, visibility, hex, event }) => {
      const agenda = await loadAgenda();
      agenda.events = agenda.events.map((entry) => entry.metadata.hex === hex
        && (!occurrenceId || entry.occurrenceId === occurrenceId)
        ? { ...entry, metadata: { ...entry.metadata, status: { ...entry.metadata.status, isHidden: visibility === true } } }
        : entry);
      await writeAgenda(agenda);
      return { matched: 1 };
    },"""
          new = """    publishCanonicalEventToAgenda: async ({ loadAgenda, writeAgenda, hex, event }) => {
      const agenda = await loadAgenda();
      let matched = 0;
      agenda.events = agenda.events.map((entry) => {
        if (entry.metadata.hex !== hex) return entry;
        matched += 1;
        return { ...entry, metadata: clone(event.metadata) };
      });
      await writeAgenda(agenda);
      return { matched };
    },"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one persistence publisher fixture, found {text.count(old)}')
          text = text.replace(old, new, 1)
          text, n = re.subn(
              r"\ntest\('real persistence handler rejects an occurrence read-back mismatch and records attention'.*\Z",
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('expected obsolete occurrence read-back test')
          path.write_text(text)
          PY
      - name: Verify targeted regressions
        run: |
          git diff --check
          node --check website/admin/admin-script.js
          node --check website/admin/admin-approval-workflow.js
          node --check lambdas/scouts/function/scouts-service.mjs
          node --check lambdas/sqs2scouts/function/persistence-processor.mjs
          node --test lambdas/sqs2scouts/function/tests/test-agenda-publisher.mjs
          node --test lambdas/sqs2scouts/function/tests/test-deployment-artifact.mjs
          node --test lambdas/sqs2scouts/function/tests/test-persistence-handler.mjs
          node --experimental-vm-modules --test lambdas/scouts/function/tests/test-api-handler.mjs
          node --test tests/issue-91-presentation.test.mjs
          node --test tests/issue-94-admin-slack-sync.integration.test.mjs
          node --test tests/issue-125-regression-safety.test.mjs
      - name: Commit follow-up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make HEX canonical for shared event state'
          git push origin HEAD:changes
