name: Run Gemini SDK migration

on:
  push:
    branches:
      - refactor/gemini-genai-sdk

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refactor/gemini-genai-sdk
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Apply SDK migration
        run: python3 .github/scripts/migrate-gemini-genai-sdk.py

      - name: Refresh shared-layer lockfile
        working-directory: lambdas/shared-layer/nodejs
        run: npm install --package-lock-only --ignore-scripts

      - name: Install shared-layer dependencies for tests
        working-directory: lambdas/shared-layer/nodejs
        run: npm ci --ignore-scripts

      - name: Verify deprecated SDK is gone from runtime sources and manifests
        run: |
          if grep -R --line-number --fixed-strings '@google/generative-ai' \
            lambdas/sqs2scouts/function \
            lambdas/shared-layer/nodejs/package.json \
            lambdas/shared-layer/nodejs/package-lock.json \
            lambdas/scouts/package.json \
            lambdas/scouts/docs/README.md; then
            echo 'Deprecated Gemini SDK reference remains' >&2
            exit 1
          fi

      - name: Run Gemini text model tests
        run: node --test lambdas/sqs2scouts/function/tests/test-gemini-text-models.mjs

      - name: Run enrichment-state tests
        run: node --test lambdas/shared-layer/nodejs/enrichment-state.test.mjs

      - name: Run AI generation contracts
        run: node --test tests/ai-generation-contract.test.mjs

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lambdas/sqs2scouts/function/persistence-processor.mjs \
            lambdas/shared-layer/nodejs/package.json \
            lambdas/shared-layer/nodejs/package-lock.json \
            lambdas/scouts/package.json \
            lambdas/scouts/docs/README.md \
            tests/ai-generation-contract.test.mjs
          git diff --cached --check
          git commit -m 'Migrate Gemini text generation to @google/genai'
          git push origin HEAD:refactor/gemini-genai-sdk
