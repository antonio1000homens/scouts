name: Deploy Website to S3

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        aws-access-key-id: ${{ secrets['AWS_ACCESS_KEY_ID'] }}
        aws-secret-access-key: ${{ secrets['AWS_SECRET_ACCESS_KEY'] }}
        aws-region: eu-west-2

    - name: Configure S3 bucket for static website hosting
      run: |
        aws s3 website s3://2ndtolworth/ \
          --index-document index.html \
          --error-document index.html

    - name: Set S3 bucket policy for public read access
      run: |
        cat > bucket-policy.json << 'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "PublicReadGetObject",
              "Effect": "Allow",
              "Principal": "*",
              "Action": "s3:GetObject",
              "Resource": "arn:aws:s3:::2ndtolworth/*"
            }
          ]
        }
        EOF
        aws s3api put-bucket-policy --bucket 2ndtolworth --policy file://bucket-policy.json

    - name: Generate admin runtime config for Cloudflare proxy
      env:
        ADMIN_API_BASE: ${{ vars['ADMIN_API_BASE'] }}
        SCOUTS_AUTH_STATUS_URL: ${{ vars['SCOUTS_AUTH_STATUS_URL'] }}
        SCOUTS_REFRESH_URL: ${{ vars['SCOUTS_REFRESH_URL'] }}
        SCOUTS2SQS_URL: ${{ vars['SCOUTS2SQS_URL'] }}
      run: |
        ADMIN_API_BASE_VALUE="${ADMIN_API_BASE:-/admin-api}"
        {
          echo "// Generated during CI deploy for Cloudflare Worker proxy mode."
          echo "window.ADMIN_API_BASE = '${ADMIN_API_BASE_VALUE}';"
          if [ -n "${SCOUTS_AUTH_STATUS_URL:-}" ]; then
            echo "window.SCOUTS_AUTH_STATUS_URL = '${SCOUTS_AUTH_STATUS_URL}';"
          fi
          if [ -n "${SCOUTS_REFRESH_URL:-}" ]; then
            echo "window.SCOUTS_REFRESH_URL = '${SCOUTS_REFRESH_URL}';"
          fi
          if [ -n "${SCOUTS2SQS_URL:-}" ]; then
            echo "window.SCOUTS2SQS_URL = '${SCOUTS2SQS_URL}';"
          fi
        } > website/admin/admin-config.js

    - name: Deploy website to S3
      run: |
        legacy_dirs=(beavers badges contact cubs fonts hiringtheden images history location scouts-page volunteering welcome)
        for dir in "${legacy_dirs[@]}"; do
          echo "Removing legacy path s3://2ndtolworth/${dir} (if any)"
          aws s3 rm "s3://2ndtolworth/${dir}" --recursive --quiet >/dev/null 2>&1 || true
        done
        aws s3 sync . s3://2ndtolworth/ --exclude "*" --include "index.html" \
          --cache-control "max-age=0, no-cache, no-store, must-revalidate"
        aws s3 sync website/ s3://2ndtolworth/website/ \
          --delete \
          --exclude "eventImages/*" \
          --exclude "eventImages/**" \
          --cache-control "max-age=0, no-cache, no-store, must-revalidate"
        if [ -d website/eventImages ]; then
          aws s3 sync website/eventImages/ s3://2ndtolworth/website/eventImages/ \
            --cache-control "max-age=0, no-cache, no-store, must-revalidate"
        fi

    - name: Upload AI.conf to S3 root (if present)
      run: |
        if [ -f AI.conf ]; then
          echo "Uploading AI.conf to s3://2ndtolworth/AI.conf"
          aws s3 cp AI.conf s3://2ndtolworth/AI.conf \
            --acl private \
            --cache-control "max-age=0, no-cache, no-store, must-revalidate"
        elif [ -f website/AI.conf ]; then
          echo "Uploading website/AI.conf to s3://2ndtolworth/AI.conf"
          aws s3 cp website/AI.conf s3://2ndtolworth/AI.conf \
            --acl private \
            --cache-control "max-age=0, no-cache, no-store, must-revalidate"
        else
          echo "No AI.conf found in repository root or website/, skipping"
        fi

    - name: Invalidate CloudFront cache
      env:
        CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets['CLOUDFRONT_DISTRIBUTION_ID'] }}
      run: |
        if [ -n "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/index.html" "/AI.conf" "/website/*"
        else
          echo "No CLOUDFRONT_DISTRIBUTION_ID secret set; skipping invalidation."
        fi

    - name: Deployment complete
      run: |
        echo "Website deployed successfully!"
        echo "Website URL: http://2ndtolworth.s3-website.eu-west-2.amazonaws.com"
