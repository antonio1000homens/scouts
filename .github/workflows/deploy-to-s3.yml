name: Deploy Website to S3

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-2
      WEBSITE_BUCKET: scouts-2ndtolworth-prod-553490163883
      # Set in GitHub Actions repository variables.
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
        role-session-name: github-actions-scouts-deploy

    - name: Configure S3 bucket for static website hosting
      run: |
        aws s3 website "s3://${WEBSITE_BUCKET}/" \
          --index-document index.html \
          --error-document index.html
        aws s3api put-public-access-block \
          --bucket "${WEBSITE_BUCKET}" \
          --public-access-block-configuration \
            BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false

    - name: Set S3 bucket policy for public read access
      run: |
        cat > bucket-policy.json << 'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "PublicReadGetObject",
              "Effect": "Allow",
              "Principal": "*",
              "Action": "s3:GetObject",
              "Resource": "arn:aws:s3:::WEBSITE_BUCKET_PLACEHOLDER/*"
            }
          ]
        }
        EOF
        sed "s/WEBSITE_BUCKET_PLACEHOLDER/${WEBSITE_BUCKET}/g" bucket-policy.json > bucket-policy.rendered.json
        aws s3api put-bucket-policy --bucket "${WEBSITE_BUCKET}" --policy file://bucket-policy.rendered.json

    - name: Generate admin runtime config for Cloudflare proxy
      env:
        ADMIN_API_BASE: ${{ vars['ADMIN_API_BASE'] }}
        SCOUTS_AUTH_STATUS_URL: ${{ vars['SCOUTS_AUTH_STATUS_URL'] }}
        SCOUTS_REFRESH_URL: ${{ vars['SCOUTS_REFRESH_URL'] }}
        SCOUTS_CONFIG_URL: ${{ vars['SCOUTS_CONFIG_URL'] }}
      run: |
        ADMIN_API_BASE_VALUE="${ADMIN_API_BASE:-/admin-api}"
        {
          echo "// Generated during CI deploy for Cloudflare Worker proxy mode."
          echo "window.ADMIN_API_BASE = '${ADMIN_API_BASE_VALUE}';"
          if [ -n "${SCOUTS_AUTH_STATUS_URL:-}" ]; then
            echo "window.SCOUTS_AUTH_STATUS_URL = '${SCOUTS_AUTH_STATUS_URL}';"
          fi
          if [ -n "${SCOUTS_REFRESH_URL:-}" ]; then
            echo "window.SCOUTS_REFRESH_URL = '${SCOUTS_REFRESH_URL}';"
          fi
          if [ -n "${SCOUTS_CONFIG_URL:-}" ]; then
            echo "window.SCOUTS_CONFIG_URL = '${SCOUTS_CONFIG_URL}';"
          fi
        } > website/admin/admin-config.js

    - name: Deploy website to S3
      run: |
        legacy_dirs=(beavers badges contact cubs fonts hiringtheden images history location scouts-page volunteering welcome)
        for dir in "${legacy_dirs[@]}"; do
          echo "Removing legacy path s3://${WEBSITE_BUCKET}/${dir} (if any)"
          aws s3 rm "s3://${WEBSITE_BUCKET}/${dir}" --recursive --quiet >/dev/null 2>&1 || true
        done
        aws s3 sync . "s3://${WEBSITE_BUCKET}/" --exclude "*" --include "index.html" \
          --cache-control "max-age=0, no-cache, no-store, must-revalidate"
        aws s3 sync website/ "s3://${WEBSITE_BUCKET}/website/" \
          --delete \
          --exclude "eventImages/*" \
          --exclude "eventImages/**" \
          --cache-control "max-age=0, no-cache, no-store, must-revalidate"
        if [ -d website/eventImages ]; then
          aws s3 sync website/eventImages/ "s3://${WEBSITE_BUCKET}/website/eventImages/" \
            --cache-control "max-age=0, no-cache, no-store, must-revalidate"
        fi

    - name: Upload scouts.conf to S3 root (if present)
      run: |
        if [ -f lambdas/scouts/sqs/sqs2scouts/scouts.conf ]; then
          echo "Uploading lambdas/scouts/sqs/sqs2scouts/scouts.conf to s3://${WEBSITE_BUCKET}/scouts.conf"
          aws s3 cp lambdas/scouts/sqs/sqs2scouts/scouts.conf "s3://${WEBSITE_BUCKET}/scouts.conf" \
            --acl private \
            --cache-control "max-age=0, no-cache, no-store, must-revalidate"
        else
          echo "No scouts.conf found in lambdas/scouts/sqs/sqs2scouts/, skipping"
        fi

    - name: Invalidate CloudFront cache
      env:
        CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets['CLOUDFRONT_DISTRIBUTION_ID'] }}
      run: |
        if [ -n "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
          echo "Invalidating CloudFront distribution ${CLOUDFRONT_DISTRIBUTION_ID}..."
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/index.html" "/scouts.conf" "/website/*" "/agenda.json" "/runtime/*" "/events/*"
          echo "CloudFront invalidation submitted."
        else
          echo "No CLOUDFRONT_DISTRIBUTION_ID secret set; skipping invalidation."
        fi

    - name: Deployment complete
      run: |
        echo "Website deployed successfully!"
        echo "Website URL: https://${WEBSITE_BUCKET}.s3.eu-west-2.amazonaws.com"
