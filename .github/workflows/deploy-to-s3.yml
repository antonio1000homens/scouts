name: Deploy Website to S3

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-west-2

    - name: Configure S3 bucket for static website hosting
      run: |
        aws s3 website s3://2ndtolworth/ \
          --index-document index.html \
          --error-document index.html

    - name: Set S3 bucket policy for public read access
      run: |
        cat > bucket-policy.json << 'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "PublicReadGetObject",
              "Effect": "Allow",
              "Principal": "*",
              "Action": "s3:GetObject",
              "Resource": "arn:aws:s3:::2ndtolworth/*"
            }
          ]
        }
        EOF
        aws s3api put-bucket-policy --bucket 2ndtolworth --policy file://bucket-policy.json

    - name: Deploy website to S3
      run: |
        aws s3 sync . s3://2ndtolworth/ --exclude "*" --include "index.html"
        aws s3 sync website/ s3://2ndtolworth/website/ --delete

    - name: Upload pixabay.conf to S3 root (if present)
      run: |
        if [ -f pixabay.conf ]; then
          echo "Uploading pixabay.conf to s3://2ndtolworth/pixabay.conf"
          aws s3 cp pixabay.conf s3://2ndtolworth/pixabay.conf --acl private
        elif [ -f website/pixabay.conf ]; then
          echo "Uploading website/pixabay.conf to s3://2ndtolworth/pixabay.conf"
          aws s3 cp website/pixabay.conf s3://2ndtolworth/pixabay.conf --acl private
        else
          echo "No pixabay.conf found in repository root or website/, skipping"
        fi

    - name: Deployment complete
      run: |
        echo "Website deployed successfully!"
        echo "Website URL: http://2ndtolworth.s3-website.eu-west-2.amazonaws.com"
