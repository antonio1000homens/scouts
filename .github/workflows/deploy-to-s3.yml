name: Deploy Scouts

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Deploy target (changed, all, or a specific Scouts component)
        required: false
        default: changed
        type: choice
        options:
          - changed
          - all
          - aws-bootstrap
          - website
          - cloudflare
          - scouts-queues
          - scouts-function
          - scouts-slack-handler
          - scouts-full-enrich
          - scouts2sqs
          - sqs2scouts
      deploy_all:
        description: Deploy all Scouts jobs regardless of change detection
        required: false
        default: 'false'

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  EXPECTED_AWS_ACCOUNT: ${{ vars.EXPECTED_AWS_ACCOUNT }}
  WEBSITE_BUCKET: ${{ vars.WEBSITE_BUCKET }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  CLOUDFORMATION_ROLE_ARN: ${{ vars.CLOUDFORMATION_ROLE_ARN }}
  CODE_BUCKET: ${{ vars.CODE_BUCKET }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  plan-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      aws_bootstrap: ${{ steps.plan.outputs.aws_bootstrap }}
      website: ${{ steps.plan.outputs.website }}
      cloudflare: ${{ steps.plan.outputs.cloudflare }}
      scouts_queues: ${{ steps.plan.outputs.scouts_queues }}
      scouts_function: ${{ steps.plan.outputs.scouts_function }}
      scouts_slack_handler: ${{ steps.plan.outputs.scouts_slack_handler }}
      scouts_full_enrich: ${{ steps.plan.outputs.scouts_full_enrich }}
      scouts2sqs: ${{ steps.plan.outputs.scouts2sqs }}
      sqs2scouts: ${{ steps.plan.outputs.sqs2scouts }}
      retry_safety: ${{ steps.plan.outputs.retry_safety }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate repository deployment variables
        run: |
          set -euo pipefail
          test -n "${EXPECTED_AWS_ACCOUNT:-}" || { echo "GitHub Actions variable EXPECTED_AWS_ACCOUNT is required" >&2; exit 1; }
          test -n "${WEBSITE_BUCKET:-}" || { echo "GitHub Actions variable WEBSITE_BUCKET is required" >&2; exit 1; }
          test -n "${CODE_BUCKET:-}" || { echo "GitHub Actions variable CODE_BUCKET is required" >&2; exit 1; }

      - name: Plan changed deployment targets
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEPLOY_TARGET: ${{ github.event.inputs.deploy_target || 'changed' }}
          DEPLOY_ALL: ${{ github.event.inputs.deploy_all || 'false' }}
        run: |
          set -euo pipefail

          aws_bootstrap=false
          website=false
          cloudflare=false
          scouts_queues=false
          scouts_function=false
          scouts_slack_handler=false
          scouts_full_enrich=false
          scouts2sqs=false
          sqs2scouts=false
          retry_safety=false

          base_ref=''
          if [ "${EVENT_NAME}" = 'pull_request' ]; then
            base_ref="${PR_BASE_SHA:-}"
            if [ -n "${base_ref}" ] && ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "${base_ref}" --depth=1
            fi
          elif [ "${EVENT_NAME}" = 'push' ]; then
            if [ -n "${EVENT_BEFORE:-}" ] && [ "${EVENT_BEFORE}" != '0000000000000000000000000000000000000000' ]; then
              base_ref="${EVENT_BEFORE}"
              if ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
                git fetch --no-tags origin "${base_ref}" --depth=1
              fi
            elif git rev-parse HEAD^ >/dev/null 2>&1; then
              base_ref='HEAD^'
            fi
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base_ref='HEAD^'
          fi

          if [ -n "${base_ref}" ]; then
            changed_files="$(git diff --name-only "${base_ref}" "${EVENT_SHA}")"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r "${EVENT_SHA}")"
          fi

          echo "Base ref: ${base_ref:-<none>}"
          echo "Changed files:"
          printf '%s\n' "${changed_files:-<none>}"

          while IFS= read -r file; do
            [ -n "${file}" ] || continue
            case "${file}" in aws/bootstrap/*) aws_bootstrap=true ;; esac
            case "${file}" in index.html|deploy.sh|deploy-manual.sh|lambdas/sqs2scouts/scouts.conf|website/*) website=true ;; esac
            case "${file}" in cloudflare/*) cloudflare=true ;; esac
            case "${file}" in lambdas/scouts-queues/*|lambdas/cloudformation/templates/scouts-queues.yaml) scouts_queues=true ;; esac
            case "${file}" in lambdas/scouts/*|lambdas/tools/*|lambdas/cloudformation/templates/scouts.yaml) scouts_function=true ;; esac
            case "${file}" in lambdas/scouts-slack-handler/*|lambdas/tools/*|lambdas/cloudformation/templates/slack-handler.yaml) scouts_slack_handler=true ;; esac
            case "${file}" in lambdas/scouts-full-enrich/*|lambdas/cloudformation/templates/scouts-full-enrich.yaml) scouts_full_enrich=true ;; esac
            case "${file}" in lambdas/scouts2sqs/*|lambdas/tools/*|lambdas/cloudformation/templates/scouts2sqs.yaml) scouts2sqs=true ;; esac
            case "${file}" in lambdas/sqs2scouts/*|lambdas/tools/*|lambdas/cloudformation/templates/sqs2scouts.yaml) sqs2scouts=true ;; esac
            case "${file}" in
              lambdas/shared-layer/nodejs/*.test.mjs|lambdas/shared-layer/nodejs/*.integration.test.mjs)
                ;;
              lambdas/shared-layer/nodejs/*.mjs|lambdas/shared-layer/nodejs/package.json|lambdas/shared-layer/nodejs/package-lock.json)
                scouts_function=true
                scouts_slack_handler=true
                scouts2sqs=true
                sqs2scouts=true
                ;;
            esac
            case "${file}" in
              deploy.sh|lambdas/shared-layer/*|lambdas/scouts/*|lambdas/scouts2sqs/*|lambdas/sqs2scouts/*|lambdas/cloudformation/templates/scouts.yaml|lambdas/cloudformation/templates/scouts2sqs.yaml|lambdas/cloudformation/templates/sqs2scouts.yaml|GEMINI-ENRICHMENT-RETRY.md|tests/issue-16-pipeline.integration.test.mjs|tests/deployment-order.integration.test.mjs|tests/issue-34-admin-ui.integration.test.mjs|tests/issue-39-*.test.mjs|tests/issue-39-*.integration.test.mjs|tests/issue-43-*.test.mjs|tests/issue-125-*.test.mjs|tests/admin-notifications.test.mjs|tests/public-repo-safety.test.mjs|tests/helpers/*|scripts/run-hermetic-tests.mjs|eslint.config.mjs|docs/TESTING-STRATEGY.md|website/admin/*|.github/workflows/deploy-to-s3.yml)
                retry_safety=true
                ;;
            esac
          done <<< "${changed_files}"

          # Preserve the old graph's implicit queue prerequisite: these services
          # always deployed the queue stack first when they were selected by changes.
          if [ "${scouts_function}" = 'true' ] || [ "${scouts2sqs}" = 'true' ] || [ "${sqs2scouts}" = 'true' ]; then
            scouts_queues=true
          fi

          if [ "${EVENT_NAME}" = 'workflow_dispatch' ]; then
            retry_safety=true
            if [ "${DEPLOY_ALL}" = 'true' ] || [ "${DEPLOY_TARGET}" = 'all' ]; then
              aws_bootstrap=true
              website=true
              cloudflare=true
              scouts_queues=true
              scouts_function=true
              scouts_slack_handler=true
              scouts_full_enrich=true
              scouts2sqs=true
              sqs2scouts=true
            elif [ "${DEPLOY_TARGET}" != 'changed' ]; then
              aws_bootstrap=false
              website=false
              cloudflare=false
              scouts_queues=false
              scouts_function=false
              scouts_slack_handler=false
              scouts_full_enrich=false
              scouts2sqs=false
              sqs2scouts=false
              case "${DEPLOY_TARGET}" in
                aws-bootstrap) aws_bootstrap=true ;;
                website) website=true ;;
                cloudflare) cloudflare=true ;;
                scouts-queues) aws_bootstrap=true; scouts_queues=true ;;
                scouts-function) aws_bootstrap=true; scouts_queues=true; scouts_function=true ;;
                scouts-slack-handler) scouts_slack_handler=true ;;
                scouts-full-enrich) scouts_full_enrich=true ;;
                scouts2sqs) aws_bootstrap=true; scouts_queues=true; scouts2sqs=true ;;
                sqs2scouts) aws_bootstrap=true; scouts_queues=true; sqs2scouts=true ;;
                *) echo "Unknown deploy target: ${DEPLOY_TARGET}"; exit 1 ;;
              esac
            fi
          fi

          {
            echo "aws_bootstrap=${aws_bootstrap}"
            echo "website=${website}"
            echo "cloudflare=${cloudflare}"
            echo "scouts_queues=${scouts_queues}"
            echo "scouts_function=${scouts_function}"
            echo "scouts_slack_handler=${scouts_slack_handler}"
            echo "scouts_full_enrich=${scouts_full_enrich}"
            echo "scouts2sqs=${scouts2sqs}"
            echo "sqs2scouts=${sqs2scouts}"
            echo "retry_safety=${retry_safety}"
          } >> "${GITHUB_OUTPUT}"

          echo "Deployment plan:"
          printf '  %-24s %s\n' aws-bootstrap "${aws_bootstrap}"
          printf '  %-24s %s\n' website "${website}"
          printf '  %-24s %s\n' cloudflare "${cloudflare}"
          printf '  %-24s %s\n' scouts-queues "${scouts_queues}"
          printf '  %-24s %s\n' scouts-function "${scouts_function}"
          printf '  %-24s %s\n' scouts-slack-handler "${scouts_slack_handler}"
          printf '  %-24s %s\n' scouts-full-enrich "${scouts_full_enrich}"
          printf '  %-24s %s\n' scouts2sqs "${scouts2sqs}"
          printf '  %-24s %s\n' sqs2scouts "${sqs2scouts}"
          printf '  %-24s %s\n' retry-safety "${retry_safety}"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.plan.outputs.retry_safety == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lambdas/shared-layer/nodejs/package-lock.json

      - name: Install shared-layer dependencies
        if: steps.plan.outputs.retry_safety == 'true'
        working-directory: lambdas/shared-layer/nodejs
        run: npm ci

      - name: Run authoritative hermetic test and static-safety runner
        if: steps.plan.outputs.retry_safety == 'true'
        run: node scripts/run-hermetic-tests.mjs

  enforce-log-retention:
    needs: plan-and-test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-scouts-log-retention

      - name: Verify AWS account and enforce Lambda log retention
        run: |
          set -euo pipefail
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          test "${actual_account}" = "${EXPECTED_AWS_ACCOUNT}" || {
            echo "Unexpected AWS account: ${actual_account}" >&2
            exit 1
          }

          retention_days=30
          log_groups=(
            /aws/lambda/scouts
            /aws/lambda/scouts-dlq-activity
            /aws/lambda/scouts2sqs
            /aws/lambda/sqs2scouts
          )

          for log_group in "${log_groups[@]}"; do
            aws logs put-retention-policy               --log-group-name "${log_group}"               --retention-in-days "${retention_days}"

            actual_retention="$(aws logs describe-log-groups               --log-group-name-prefix "${log_group}"               --query "logGroups[?logGroupName=='${log_group}'].retentionInDays | [0]"               --output text)"
            test "${actual_retention}" = "${retention_days}" || {
              echo "Retention verification failed for ${log_group}: ${actual_retention}" >&2
              exit 1
            }
          done

  deploy-web:
    needs: plan-and-test
    permissions:
      contents: read
      id-token: write
    if: github.event_name != 'pull_request' && (needs.plan-and-test.outputs.website == 'true' || needs.plan-and-test.outputs.cloudflare == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: scouts-web-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate website deployment configuration
        run: |
          set -euo pipefail
          test -n "${WEBSITE_BUCKET:-}" || { echo "GitHub Actions variable WEBSITE_BUCKET is required" >&2; exit 1; }

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.plan-and-test.outputs.cloudflare == 'true'
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Get Cloudflare deployment secrets from Bitwarden
        if: needs.plan-and-test.outputs.cloudflare == 'true'
        id: fetch_cloudflare_secrets
        continue-on-error: true
        uses: bitwarden/sm-action@14f92f1d294ae3c2b6a3845d389cd2c318b0dfd8 # v2.2.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_SECRET_ID_CF_DEPLOY_API_TOKEN || vars.BW_SCOUTS_CF_DEPLOY }} > CF_DEPLOY_API_TOKEN
            ${{ vars.BW_SCOUTS_SLACK_HANDLER_URL }} > SCOUTS_SLACK_HANDLER_URL

      - name: Retry Cloudflare deployment secrets
        if: needs.plan-and-test.outputs.cloudflare == 'true' && steps.fetch_cloudflare_secrets.outcome == 'failure'
        uses: bitwarden/sm-action@14f92f1d294ae3c2b6a3845d389cd2c318b0dfd8 # v2.2.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_SECRET_ID_CF_DEPLOY_API_TOKEN || vars.BW_SCOUTS_CF_DEPLOY }} > CF_DEPLOY_API_TOKEN
            ${{ vars.BW_SCOUTS_SLACK_HANDLER_URL }} > SCOUTS_SLACK_HANDLER_URL

      - name: Install Wrangler
        if: needs.plan-and-test.outputs.cloudflare == 'true'
        run: npm install --global wrangler@4

      - name: Deploy admin proxy worker
        if: needs.plan-and-test.outputs.cloudflare == 'true'
        run: bash cloudflare/scouts-admin-proxy/deploy-ci.sh

      - name: Deploy Slack handler worker
        if: needs.plan-and-test.outputs.cloudflare == 'true'
        run: bash cloudflare/scouts-slack-handler/deploy-ci.sh

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        if: needs.plan-and-test.outputs.website == 'true'
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-scouts-web-deploy

      - name: Get CloudFront distribution ID from Bitwarden
        if: needs.plan-and-test.outputs.website == 'true'
        id: fetch_cloudfront_distribution_id
        continue-on-error: true
        uses: bitwarden/sm-action@14f92f1d294ae3c2b6a3845d389cd2c318b0dfd8 # v2.2.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_CLOUDFRONT_DISTRIBUTION_ID }} > CLOUDFRONT_DISTRIBUTION_ID

      - name: Retry CloudFront distribution ID
        if: needs.plan-and-test.outputs.website == 'true' && steps.fetch_cloudfront_distribution_id.outcome == 'failure'
        uses: bitwarden/sm-action@14f92f1d294ae3c2b6a3845d389cd2c318b0dfd8 # v2.2.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_CLOUDFRONT_DISTRIBUTION_ID }} > CLOUDFRONT_DISTRIBUTION_ID

      - name: Configure S3 static website hosting
        if: needs.plan-and-test.outputs.website == 'true'
        run: |
          aws s3 website "s3://${WEBSITE_BUCKET}/" --index-document index.html --error-document index.html
          aws s3api put-public-access-block \
            --bucket "${WEBSITE_BUCKET}" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=false,RestrictPublicBuckets=false

      - name: Set S3 public-read allowlist policy
        if: needs.plan-and-test.outputs.website == 'true'
        run: |
          cat > bucket-policy.json << 'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Sid": "PublicReadWebsiteAllowlist",
              "Effect": "Allow",
              "Principal": "*",
              "Action": "s3:GetObject",
              "Resource": [
                "arn:aws:s3:::WEBSITE_BUCKET_PLACEHOLDER/index.html",
                "arn:aws:s3:::WEBSITE_BUCKET_PLACEHOLDER/agenda.json",
                "arn:aws:s3:::WEBSITE_BUCKET_PLACEHOLDER/scouts.conf",
                "arn:aws:s3:::WEBSITE_BUCKET_PLACEHOLDER/website/*"
              ]
            }]
          }
          EOF
          sed "s/WEBSITE_BUCKET_PLACEHOLDER/${WEBSITE_BUCKET}/g" bucket-policy.json > bucket-policy.rendered.json
          aws s3api put-bucket-policy --bucket "${WEBSITE_BUCKET}" --policy file://bucket-policy.rendered.json

      - name: Generate admin runtime config
        if: needs.plan-and-test.outputs.website == 'true'
        env:
          ADMIN_API_BASE: ${{ vars.ADMIN_API_BASE }}
          SCOUTS_AUTH_STATUS_URL: ${{ vars['SCOUTS_AUTH_STATUS_URL'] }}
          SCOUTS_CONFIG_URL: ${{ vars['SCOUTS_CONFIG_URL'] }}
        run: |
          ADMIN_API_BASE_VALUE="${ADMIN_API_BASE:-/admin-api}"
          {
            echo "// Generated during CI deploy for Cloudflare proxy mode."
            echo "window.ADMIN_API_BASE = '${ADMIN_API_BASE_VALUE}';"
            [ -z "${SCOUTS_AUTH_STATUS_URL:-}" ] || echo "window.SCOUTS_AUTH_STATUS_URL = '${SCOUTS_AUTH_STATUS_URL}';"
            [ -z "${SCOUTS_CONFIG_URL:-}" ] || echo "window.SCOUTS_CONFIG_URL = '${SCOUTS_CONFIG_URL}';"
          } > website/admin/admin-config.js

      - name: Deploy website to S3
        if: needs.plan-and-test.outputs.website == 'true'
        run: |
          legacy_dirs=(beavers badges contact cubs fonts hiringtheden images history location scouts-page volunteering welcome)
          for dir in "${legacy_dirs[@]}"; do
            aws s3 rm "s3://${WEBSITE_BUCKET}/${dir}" --recursive --quiet >/dev/null 2>&1 || true
          done
          aws s3 sync . "s3://${WEBSITE_BUCKET}/" --exclude "*" --include "index.html" --cache-control "max-age=0, no-cache, no-store, must-revalidate"
          aws s3 sync website/ "s3://${WEBSITE_BUCKET}/website/" --delete --exclude "eventImages/*" --exclude "eventImages/**" --cache-control "max-age=0, no-cache, no-store, must-revalidate"
          if [ -d website/eventImages ]; then
            aws s3 sync website/eventImages/ "s3://${WEBSITE_BUCKET}/website/eventImages/" --cache-control "max-age=0, no-cache, no-store, must-revalidate"
          fi

      - name: Upload scouts.conf to S3 root
        if: needs.plan-and-test.outputs.website == 'true'
        run: |
          if [ -f lambdas/sqs2scouts/scouts.conf ]; then
            aws s3 cp lambdas/sqs2scouts/scouts.conf "s3://${WEBSITE_BUCKET}/scouts.conf" --cache-control "max-age=0, no-cache, no-store, must-revalidate"
          fi

      - name: Invalidate CloudFront cache
        if: needs.plan-and-test.outputs.website == 'true'
        run: |
          if [ -n "${CLOUDFRONT_DISTRIBUTION_ID:-}" ] && aws cloudfront get-distribution --id "${CLOUDFRONT_DISTRIBUTION_ID}" >/dev/null 2>&1; then
            aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/index.html" "/scouts.conf" "/website/*" "/agenda.json"
          fi

  deploy-aws:
    needs: plan-and-test
    permissions:
      contents: read
      id-token: write
    if: >-
      github.event_name != 'pull_request' &&
      (needs.plan-and-test.outputs.aws_bootstrap == 'true' ||
       needs.plan-and-test.outputs.scouts_queues == 'true' ||
       needs.plan-and-test.outputs.scouts_full_enrich == 'true' ||
       needs.plan-and-test.outputs.sqs2scouts == 'true' ||
       needs.plan-and-test.outputs.scouts2sqs == 'true' ||
       needs.plan-and-test.outputs.scouts_function == 'true' ||
       needs.plan-and-test.outputs.scouts_slack_handler == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: scouts-aws-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate AWS deployment configuration
        run: |
          set -euo pipefail
          test -n "${EXPECTED_AWS_ACCOUNT:-}" || { echo "GitHub Actions variable EXPECTED_AWS_ACCOUNT is required" >&2; exit 1; }

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Restore npm cache for shared layer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-scouts-shared-layer-${{ hashFiles('lambdas/shared-layer/nodejs/package-lock.json') }}

      - name: Ensure jq is available
        run: command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-scouts-aws-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve shared Lambda layer version
        if: needs.plan-and-test.outputs.sqs2scouts == 'true' || needs.plan-and-test.outputs.scouts2sqs == 'true' || needs.plan-and-test.outputs.scouts_function == 'true' || needs.plan-and-test.outputs.scouts_slack_handler == 'true'
        env:
          CODE_BUCKET: ${{ env.CODE_BUCKET }}
          EXPECTED_AWS_ACCOUNT: ${{ env.EXPECTED_AWS_ACCOUNT }}
        run: bash lambdas/shared-layer/deploy.sh

      - name: Get required Scouts API key
        if: needs.plan-and-test.outputs.scouts_function == 'true' || needs.plan-and-test.outputs.scouts2sqs == 'true' || needs.plan-and-test.outputs.scouts_slack_handler == 'true'
        id: fetch_required_api_key
        continue-on-error: true
        uses: bitwarden/sm-action@14f92f1d294ae3c2b6a3845d389cd2c318b0dfd8 # v2.2.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_SCOUTS_REQUIRED_API_KEY }} > SCOUTS_REQUIRED_API_KEY

      - name: Retry required Scouts API key
        if: (needs.plan-and-test.outputs.scouts_function == 'true' || needs.plan-and-test.outputs.scouts2sqs == 'true' || needs.plan-and-test.outputs.scouts_slack_handler == 'true') && steps.fetch_required_api_key.outcome == 'failure'
        uses: bitwarden/sm-action@14f92f1d294ae3c2b6a3845d389cd2c318b0dfd8 # v2.2.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_SCOUTS_REQUIRED_API_KEY }} > SCOUTS_REQUIRED_API_KEY

      - name: Get Slack handler secrets
        if: needs.plan-and-test.outputs.scouts_slack_handler == 'true'
        id: fetch_slack_handler_secrets
        continue-on-error: true
        uses: bitwarden/sm-action@14f92f1d294ae3c2b6a3845d389cd2c318b0dfd8 # v2.2.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_SCOUTS_SLACK_SIGNING_SECRET }} > SLACK_SIGNING_SECRET
            ${{ vars.BW_SCOUTS_SLACK_BOT_TOKEN }} > SLACK_BOT_TOKEN

      - name: Retry Slack handler secrets
        if: needs.plan-and-test.outputs.scouts_slack_handler == 'true' && steps.fetch_slack_handler_secrets.outcome == 'failure'
        uses: bitwarden/sm-action@14f92f1d294ae3c2b6a3845d389cd2c318b0dfd8 # v2.2.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_SCOUTS_SLACK_SIGNING_SECRET }} > SLACK_SIGNING_SECRET
            ${{ vars.BW_SCOUTS_SLACK_BOT_TOKEN }} > SLACK_BOT_TOKEN

      - name: Get sqs2scouts provider secrets
        if: needs.plan-and-test.outputs.sqs2scouts == 'true'
        id: fetch_sqs2scouts_secrets
        # Bitwarden is an optional refresh source. deploy.sh falls back to the
        # existing SSM SecureString parameters and validates them before
        # changing the Lambda, so a stale/inaccessible Bitwarden UID must not
        # prevent the deployment from reaching that validation.
        continue-on-error: true
        uses: bitwarden/sm-action@14f92f1d294ae3c2b6a3845d389cd2c318b0dfd8 # v2.2.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_SCOUTS_SLACK_SIGNING_SECRET }} > SLACK_SIGNING_SECRET
            ${{ vars.BW_SCOUTS_SLACK_BOT_TOKEN }} > SLACK_BOT_TOKEN
            ${{ vars.BW_GEMINI_API_KEY }} > GEMINI_API_KEY
            ${{ vars.BW_CF_AI_WORKER }} > CLOUDFLARE_ACCOUNT_ID

      - name: Get Cloudflare Workers AI token
        if: needs.plan-and-test.outputs.sqs2scouts == 'true' && vars.BW_CLOUDFLARE_AI_API_TOKEN != ''
        uses: bitwarden/sm-action@14f92f1d294ae3c2b6a3845d389cd2c318b0dfd8 # v2.2.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_CLOUDFLARE_AI_API_TOKEN }} > CLOUDFLARE_AI_API_TOKEN

      - name: Deploy AWS bootstrap
        if: needs.plan-and-test.outputs.aws_bootstrap == 'true'
        env:
          CLOUDFORMATION_ROLE_ARN: ${{ env.CLOUDFORMATION_ROLE_ARN }}
          EXPECTED_AWS_ACCOUNT: ${{ env.EXPECTED_AWS_ACCOUNT }}
          CODE_BUCKET: ${{ env.CODE_BUCKET }}
        run: cd aws/bootstrap && bash ./deploy.sh

      - name: Deploy Scouts queues
        if: needs.plan-and-test.outputs.scouts_queues == 'true'
        env:
          CLOUDFORMATION_ROLE_ARN: ${{ env.CLOUDFORMATION_ROLE_ARN }}
          EXPECTED_AWS_ACCOUNT: ${{ env.EXPECTED_AWS_ACCOUNT }}
        run: cd lambdas/scouts-queues && bash ./deploy.sh

      - name: Deploy full-enrich state machine
        if: needs.plan-and-test.outputs.scouts_full_enrich == 'true'
        env:
          CLOUDFORMATION_ROLE_ARN: ${{ env.CLOUDFORMATION_ROLE_ARN }}
          EXPECTED_AWS_ACCOUNT: ${{ env.EXPECTED_AWS_ACCOUNT }}
        run: cd lambdas/scouts-full-enrich && bash ./deploy.sh

      - name: Deploy sqs2scouts
        if: needs.plan-and-test.outputs.sqs2scouts == 'true'
        env:
          CODE_BUCKET: ${{ env.CODE_BUCKET }}
          CLOUDFORMATION_ROLE_ARN: ${{ env.CLOUDFORMATION_ROLE_ARN }}
          EXPECTED_AWS_ACCOUNT: ${{ env.EXPECTED_AWS_ACCOUNT }}
          TARGET_BUCKET: ${{ env.WEBSITE_BUCKET }}
          QUEUE_ARN: arn:aws:sqs:${{ env.AWS_REGION }}:${{ env.EXPECTED_AWS_ACCOUNT }}:scoutsProcessing
          QUEUE_URL: https://sqs.${{ env.AWS_REGION }}.amazonaws.com/${{ env.EXPECTED_AWS_ACCOUNT }}/scoutsProcessing
          SCOUTS_DECISION_QUEUE_ARN: arn:aws:sqs:${{ env.AWS_REGION }}:${{ env.EXPECTED_AWS_ACCOUNT }}:scoutsDecision
          SCOUTS_DECISION_QUEUE_URL: https://sqs.${{ env.AWS_REGION }}.amazonaws.com/${{ env.EXPECTED_AWS_ACCOUNT }}/scoutsDecision
          DLQ_ARN: arn:aws:sqs:${{ env.AWS_REGION }}:${{ env.EXPECTED_AWS_ACCOUNT }}:scoutsProcessingDLQ
          DLQ_URL: https://sqs.${{ env.AWS_REGION }}.amazonaws.com/${{ env.EXPECTED_AWS_ACCOUNT }}/scoutsProcessingDLQ
          S3_WEBSITE_BASE_URL: https://${{ env.WEBSITE_BUCKET }}.s3.${{ env.AWS_REGION }}.amazonaws.com
          GEMINI_API_VERSION: ${{ vars.GEMINI_API_VERSION }}
          GEMINI_IMAGE_API_VERSION: ${{ vars.GEMINI_IMAGE_API_VERSION }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          GEMINI_TEXT_MODELS: ${{ vars.GEMINI_TEXT_MODELS || 'gemini-3.5-flash,gemini-3.1-flash-lite,gemini-2.5-flash,gemini-2.5-flash-lite' }}
          REQUIRE_GEMINI_API_KEY: 'true'
          IMAGE_GENERATION_PROVIDER: ${{ vars.IMAGE_GENERATION_PROVIDER || 'disabled' }}
          IMAGE_GENERATION_DAILY_REQUEST_LIMIT: ${{ vars.IMAGE_GENERATION_DAILY_REQUEST_LIMIT || '10' }}
          CLOUDFLARE_AI_MODEL: ${{ vars.CLOUDFLARE_AI_MODEL || '@cf/black-forest-labs/flux-1-schnell' }}
          CLOUDFLARE_AI_STEPS: ${{ vars.CLOUDFLARE_AI_STEPS || '4' }}
        run: cd lambdas/sqs2scouts && bash ./deploy.sh

      - name: Verify sqs2scouts worker
        if: needs.plan-and-test.outputs.sqs2scouts == 'true'
        run: |
          VALUE="$(aws lambda get-function-configuration --function-name sqs2scouts --region "${AWS_REGION}" --query 'Environment.Variables.GEMINI_API_KEY_PARAMETER' --output text)"
          [ -n "$VALUE" ] && [ "$VALUE" != "None" ] && [ "$VALUE" != "null" ] || { echo "GEMINI_API_KEY_PARAMETER is not set"; exit 1; }
          HANDLER="$(aws lambda get-function-configuration --function-name sqs2scouts --region "${AWS_REGION}" --query 'Handler' --output text)"
          [ "$HANDLER" = "image-provider-adapter.lambdaHandler" ] || { echo "Unexpected sqs2scouts handler: $HANDLER"; exit 1; }

      - name: Deploy scouts2sqs
        if: needs.plan-and-test.outputs.scouts2sqs == 'true'
        env:
          CODE_BUCKET: ${{ env.CODE_BUCKET }}
          CLOUDFORMATION_ROLE_ARN: ${{ env.CLOUDFORMATION_ROLE_ARN }}
          EXPECTED_AWS_ACCOUNT: ${{ env.EXPECTED_AWS_ACCOUNT }}
          TARGET_BUCKET: ${{ env.WEBSITE_BUCKET }}
          QUEUE_ARN: arn:aws:sqs:${{ env.AWS_REGION }}:${{ env.EXPECTED_AWS_ACCOUNT }}:scoutsProcessing
          QUEUE_URL: https://sqs.${{ env.AWS_REGION }}.amazonaws.com/${{ env.EXPECTED_AWS_ACCOUNT }}/scoutsProcessing
          DLQ_URL: https://sqs.${{ env.AWS_REGION }}.amazonaws.com/${{ env.EXPECTED_AWS_ACCOUNT }}/scoutsProcessingDLQ
          SCOUTS_REQUESTS_QUEUE_ARN: arn:aws:sqs:${{ env.AWS_REGION }}:${{ env.EXPECTED_AWS_ACCOUNT }}:scoutsRequests
          SCOUTS_REQUESTS_QUEUE_URL: https://sqs.${{ env.AWS_REGION }}.amazonaws.com/${{ env.EXPECTED_AWS_ACCOUNT }}/scoutsRequests
          IMAGE_GENERATION_PROVIDER: ${{ vars.IMAGE_GENERATION_PROVIDER || 'disabled' }}
        run: cd lambdas/scouts2sqs && bash ./deploy.sh

      - name: Reject plaintext calendar URL variables
        if: >-
          needs.plan-and-test.outputs.scouts_function == 'true' &&
          (startsWith(vars.CUBS_EVENTS_CALENDAR_URL, 'http://') ||
           startsWith(vars.CUBS_EVENTS_CALENDAR_URL, 'https://') ||
           startsWith(vars.CUBS_PROGRAMME_CALENDAR_URL, 'http://') ||
           startsWith(vars.CUBS_PROGRAMME_CALENDAR_URL, 'https://') ||
           startsWith(vars.SCOUTS_EVENTS_CALENDAR_URL, 'http://') ||
           startsWith(vars.SCOUTS_EVENTS_CALENDAR_URL, 'https://') ||
           startsWith(vars.SCOUTS_PROGRAMME_CALENDAR_URL, 'http://') ||
           startsWith(vars.SCOUTS_PROGRAMME_CALENDAR_URL, 'https://') ||
           startsWith(vars.BEAVERS_EVENTS_CALENDAR_URL, 'http://') ||
           startsWith(vars.BEAVERS_EVENTS_CALENDAR_URL, 'https://') ||
           startsWith(vars.BEAVERS_PROGRAMME_CALENDAR_URL, 'http://') ||
           startsWith(vars.BEAVERS_PROGRAMME_CALENDAR_URL, 'https://'))
        run: |
          echo "Calendar repository variables must contain Bitwarden secret UIDs, never calendar URLs. Empty means disabled."
          exit 1

      - name: Get Cubs events calendar URL
        if: >-
          needs.plan-and-test.outputs.scouts_function == 'true' &&
          vars.CUBS_EVENTS_CALENDAR_URL != '' &&
          !startsWith(vars.CUBS_EVENTS_CALENDAR_URL, 'http://') &&
          !startsWith(vars.CUBS_EVENTS_CALENDAR_URL, 'https://')
        uses: bitwarden/sm-action@14f92f1d294ae3c2b6a3845d389cd2c318b0dfd8 # v2.2.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.CUBS_EVENTS_CALENDAR_URL }} > CUBS_EVENTS_CALENDAR_URL

      - name: Get Cubs programme calendar URL
        if: >-
          needs.plan-and-test.outputs.scouts_function == 'true' &&
          vars.CUBS_PROGRAMME_CALENDAR_URL != '' &&
          !startsWith(vars.CUBS_PROGRAMME_CALENDAR_URL, 'http://') &&
          !startsWith(vars.CUBS_PROGRAMME_CALENDAR_URL, 'https://')
        uses: bitwarden/sm-action@14f92f1d294ae3c2b6a3845d389cd2c318b0dfd8 # v2.2.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.CUBS_PROGRAMME_CALENDAR_URL }} > CUBS_PROGRAMME_CALENDAR_URL

      - name: Get Scouts events calendar URL
        if: >-
          needs.plan-and-test.outputs.scouts_function == 'true' &&
          vars.SCOUTS_EVENTS_CALENDAR_URL != '' &&
          !startsWith(vars.SCOUTS_EVENTS_CALENDAR_URL, 'http://') &&
          !startsWith(vars.SCOUTS_EVENTS_CALENDAR_URL, 'https://')
        uses: bitwarden/sm-action@14f92f1d294ae3c2b6a3845d389cd2c318b0dfd8 # v2.2.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.SCOUTS_EVENTS_CALENDAR_URL }} > SCOUTS_EVENTS_CALENDAR_URL

      - name: Get Scouts programme calendar URL
        if: >-
          needs.plan-and-test.outputs.scouts_function == 'true' &&
          vars.SCOUTS_PROGRAMME_CALENDAR_URL != '' &&
          !startsWith(vars.SCOUTS_PROGRAMME_CALENDAR_URL, 'http://') &&
          !startsWith(vars.SCOUTS_PROGRAMME_CALENDAR_URL, 'https://')
        uses: bitwarden/sm-action@14f92f1d294ae3c2b6a3845d389cd2c318b0dfd8 # v2.2.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.SCOUTS_PROGRAMME_CALENDAR_URL }} > SCOUTS_PROGRAMME_CALENDAR_URL

      - name: Get Beavers events calendar URL
        if: >-
          needs.plan-and-test.outputs.scouts_function == 'true' &&
          vars.BEAVERS_EVENTS_CALENDAR_URL != '' &&
          !startsWith(vars.BEAVERS_EVENTS_CALENDAR_URL, 'http://') &&
          !startsWith(vars.BEAVERS_EVENTS_CALENDAR_URL, 'https://')
        uses: bitwarden/sm-action@14f92f1d294ae3c2b6a3845d389cd2c318b0dfd8 # v2.2.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BEAVERS_EVENTS_CALENDAR_URL }} > BEAVERS_EVENTS_CALENDAR_URL

      - name: Get Beavers programme calendar URL
        if: >-
          needs.plan-and-test.outputs.scouts_function == 'true' &&
          vars.BEAVERS_PROGRAMME_CALENDAR_URL != '' &&
          !startsWith(vars.BEAVERS_PROGRAMME_CALENDAR_URL, 'http://') &&
          !startsWith(vars.BEAVERS_PROGRAMME_CALENDAR_URL, 'https://')
        uses: bitwarden/sm-action@14f92f1d294ae3c2b6a3845d389cd2c318b0dfd8 # v2.2.0
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BEAVERS_PROGRAMME_CALENDAR_URL }} > BEAVERS_PROGRAMME_CALENDAR_URL

      - name: Deploy Scouts function
        if: needs.plan-and-test.outputs.scouts_function == 'true'
        env:
          CODE_BUCKET: ${{ env.CODE_BUCKET }}
          CLOUDFORMATION_ROLE_ARN: ${{ env.CLOUDFORMATION_ROLE_ARN }}
          EXPECTED_AWS_ACCOUNT: ${{ env.EXPECTED_AWS_ACCOUNT }}
          DATA_BUCKET_NAME: ${{ env.WEBSITE_BUCKET }}
          CREATE_DATA_BUCKET: 'true'
          SCOUTS_REQUESTS_QUEUE_ARN: arn:aws:sqs:${{ env.AWS_REGION }}:${{ env.EXPECTED_AWS_ACCOUNT }}:scoutsRequests
          SCOUTS_REQUESTS_QUEUE_URL: https://sqs.${{ env.AWS_REGION }}.amazonaws.com/${{ env.EXPECTED_AWS_ACCOUNT }}/scoutsRequests
          # Configured calendar feeds are resolved from Bitwarden UID variables by
          # the preceding actions. Missing variables deliberately disable feeds.
        run: cd lambdas/scouts && bash ./deploy.sh

      - name: Verify Scouts shared layer attachment
        if: needs.plan-and-test.outputs.scouts_function == 'true'
        run: |
          if [ -z "${SCOUTS_SHARED_LAYER_VERSION_ARN:-}" ]; then
            echo "SCOUTS_SHARED_LAYER_VERSION_ARN was not resolved before Scouts deployment" >&2
            exit 1
          fi
          DEPLOYED_LAYERS="$(aws lambda get-function-configuration \
            --function-name scouts \
            --region "${AWS_REGION}" \
            --query 'Layers[].Arn' \
            --output text)"
          if ! printf '%s\n' "${DEPLOYED_LAYERS}" | tr '\t' '\n' | grep -Fxq "${SCOUTS_SHARED_LAYER_VERSION_ARN}"; then
            echo "Scouts Lambda is not attached to the resolved shared layer." >&2
            echo "Expected: ${SCOUTS_SHARED_LAYER_VERSION_ARN}" >&2
            echo "Deployed: ${DEPLOYED_LAYERS}" >&2
            exit 1
          fi
          echo "Verified Scouts shared layer: ${SCOUTS_SHARED_LAYER_VERSION_ARN}"

      - name: Deploy Scouts Slack handler
        if: needs.plan-and-test.outputs.scouts_slack_handler == 'true'
        env:
          CODE_BUCKET: ${{ env.CODE_BUCKET }}
          CLOUDFORMATION_ROLE_ARN: ${{ env.CLOUDFORMATION_ROLE_ARN }}
          EXPECTED_AWS_ACCOUNT: ${{ env.EXPECTED_AWS_ACCOUNT }}
          REQUIRED_API_KEY: ${{ env.SCOUTS_REQUIRED_API_KEY }}
          SCOUTS_REQUEST_QUEUE_URL: https://sqs.${{ env.AWS_REGION }}.amazonaws.com/${{ env.EXPECTED_AWS_ACCOUNT }}/scoutsRequests
          SCOUTS_REQUEST_QUEUE_ARN: arn:aws:sqs:${{ env.AWS_REGION }}:${{ env.EXPECTED_AWS_ACCOUNT }}:scoutsRequests
          NFC_QUEUE_URL: https://sqs.${{ env.AWS_REGION }}.amazonaws.com/${{ env.EXPECTED_AWS_ACCOUNT }}/scoutsRequests
          NFC_QUEUE_ARN: arn:aws:sqs:${{ env.AWS_REGION }}:${{ env.EXPECTED_AWS_ACCOUNT }}:scoutsRequests
          TARGET_BUCKET: ${{ env.WEBSITE_BUCKET }}
          SCOUTS_CONFIG_KEY: scouts.conf
        run: cd lambdas/scouts-slack-handler && bash ./deploy.sh
