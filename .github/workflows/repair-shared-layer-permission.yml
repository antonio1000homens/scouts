name: Repair Scouts deployment permissions

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/repair-shared-layer-permission.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  EXPECTED_AWS_ACCOUNT: "553490163883"

jobs:
  repair-deployment-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-scouts-permission-repair
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [ "${account_id}" != "${EXPECTED_AWS_ACCOUNT}" ]; then
            echo "Unexpected AWS account ${account_id}; expected ${EXPECTED_AWS_ACCOUNT}." >&2
            exit 1
          fi

      - name: Grant shared Lambda layer deployment permission
        run: |
          set -euo pipefail
          cat > /tmp/scouts-shared-layer-policy.json <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "PublishScoutsSharedLayer",
                "Effect": "Allow",
                "Action": [
                  "lambda:PublishLayerVersion"
                ],
                "Resource": "arn:aws:lambda:eu-west-2:553490163883:layer:scouts-shared"
              },
              {
                "Sid": "ReadScoutsSharedLayerVersions",
                "Effect": "Allow",
                "Action": [
                  "lambda:GetLayerVersion",
                  "lambda:ListLayerVersions"
                ],
                "Resource": [
                  "arn:aws:lambda:eu-west-2:553490163883:layer:scouts-shared",
                  "arn:aws:lambda:eu-west-2:553490163883:layer:scouts-shared:*"
                ]
              }
            ]
          }
          JSON

          aws iam put-role-policy \
            --role-name GitHubActionsScoutsDeployRole \
            --policy-name ScoutsSharedLayerDeploy \
            --policy-document file:///tmp/scouts-shared-layer-policy.json

      - name: Grant CloudFront invalidation status permission
        run: |
          set -euo pipefail
          cat > /tmp/scouts-cloudfront-invalidation-policy.json <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "ReadScoutsCloudFrontInvalidation",
                "Effect": "Allow",
                "Action": [
                  "cloudfront:GetInvalidation"
                ],
                "Resource": "arn:aws:cloudfront::553490163883:distribution/E3INLSADL3AN6C"
              }
            ]
          }
          JSON

          aws iam put-role-policy \
            --role-name GitHubActionsScoutsDeployRole \
            --policy-name ScoutsCloudFrontInvalidationStatus \
            --policy-document file:///tmp/scouts-cloudfront-invalidation-policy.json

      - name: Grant CloudFormation EventBridge deployment permission
        run: |
          set -euo pipefail
          cat > /tmp/scouts-eventbridge-policy.json <<'JSON'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "ScoutsEventBridgeManagement",
                "Effect": "Allow",
                "Action": [
                  "events:DeleteRule",
                  "events:DescribeRule",
                  "events:ListTagsForResource",
                  "events:ListTargetsByRule",
                  "events:PutRule",
                  "events:PutTargets",
                  "events:RemoveTargets",
                  "events:TagResource",
                  "events:UntagResource"
                ],
                "Resource": "arn:aws:events:eu-west-2:553490163883:rule/scouts-*"
              }
            ]
          }
          JSON

          aws iam put-role-policy \
            --role-name CloudFormationExecutionRole \
            --policy-name ScoutsEventBridgeDeployRepair \
            --policy-document file:///tmp/scouts-eventbridge-policy.json

      - name: Verify repaired permission policies
        run: |
          set -euo pipefail
          aws iam get-role-policy \
            --role-name GitHubActionsScoutsDeployRole \
            --policy-name ScoutsSharedLayerDeploy \
            --query 'PolicyDocument.Statement[].Sid' \
            --output text

          aws iam get-role-policy \
            --role-name GitHubActionsScoutsDeployRole \
            --policy-name ScoutsCloudFrontInvalidationStatus \
            --query 'PolicyDocument.Statement[].Sid' \
            --output text

          aws iam get-role-policy \
            --role-name CloudFormationExecutionRole \
            --policy-name ScoutsEventBridgeDeployRepair \
            --query 'PolicyDocument.Statement[].Sid' \
            --output text
