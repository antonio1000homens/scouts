{
  "promptTemplate": "You are helping to promote a Scouts event (Beavers or Cubs). Using the details below, produce:\n- \"tagline\": one witty, high-energy tagline (max 80 characters, no quotes, no markdown).\n- \"imageTag\": 2-4 descriptive words (lowercase nouns/adjectives, no punctuation) suitable as a Pixabay search tag for a photographic background image of the event. Use thematic, generic terms even if the event name is a branded or unusual phrase (e.g., \"Laser Quest\" -> \"laser tag arena\", \"Go Ape adventure\" -> \"forest ropes course\", \"Clip 'n Climb\" -> \"indoor climbing wall\").\n\nEvent details:\n{{EVENT_DETAILS}}\n\nGuidelines for imageTag:\n{{IMAGE_TAG_GUIDELINES}}\n\nRespond with strict JSON: {\"tagline\":\"...\",\"imageTag\":\"...\"}. Do not include extra fields or commentary.",
  "imageTagGuidelines": [
    "Avoid proper nouns, brand names, or rare phrases.",
    "Prefer widely-recognised activity or setting words (e.g., \"laser tag\", \"forest camp\", \"canoe river\").",
    "Use only spaces as separators, no punctuation."
  ],
  "themedIcons": [
    { "pattern": "agm|annual.*general|general.*meeting", "icon": "agm" },
    { "pattern": "firework|bonfire", "icon": "fireworks" },
    { "pattern": "sleepover|sleep.*over|camp(?!fire)", "icon": "sleepover" },
    { "pattern": "party|celebration", "icon": "party" },
    { "pattern": "christmas|xmas", "icon": "xmas" },
    { "pattern": "night.*hike|hike.*night", "icon": "nighthike" },
    { "pattern": "laser|laser.*tag|laser.*quest", "icon": "lasertag" },
    { "pattern": "expedition|trip|journey", "icon": "expedition" },
    { "pattern": "sailing|boat", "icon": "sailing" },
    { "pattern": "campfire|fire", "icon": "fire" },
    { "pattern": "golf", "icon": "golf" },
    { "pattern": "church|service", "icon": "church" },
    { "pattern": "remembrance|poppy", "icon": "remembrance" },
    { "pattern": "dragon|den", "icon": "dragonden" },
    { "pattern": "reading|book", "icon": "bookreader" },
    { "pattern": "hike|hiking|walk", "icon": "nighthike" },
    { "pattern": "swim", "icon": "sailing" }
  ]
}
