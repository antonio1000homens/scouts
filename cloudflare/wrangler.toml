name = "scouts-admin-proxy"
main = "worker.js"
compatibility_date = "2026-03-03"

routes = [
  { pattern = "2ndtolworth.org.uk/admin-api/*", zone_name = "2ndtolworth.org.uk" },
  { pattern = "www.2ndtolworth.org.uk/admin-api/*", zone_name = "2ndtolworth.org.uk" }
]

[vars]
# Set to "true" to require a Cloudflare Access JWT on incoming requests.
REQUIRE_CF_ACCESS = "true"
