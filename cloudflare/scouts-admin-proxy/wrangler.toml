name = "scouts-admin-proxy"
main = "worker.js"
compatibility_date = "2026-03-03"
account_id = "9a5523112f1460d0f77c9ba239d00029"
workers_dev = false

routes = [
  { pattern = "2ndtolworth.org.uk/admin-api/*", zone_name = "2ndtolworth.org.uk" },
  { pattern = "2ndtolworth.org.uk/runtime/*", zone_name = "2ndtolworth.org.uk" },
  { pattern = "2ndtolworth.org.uk/events/*", zone_name = "2ndtolworth.org.uk" },
  { pattern = "2ndtolworth.org.uk/api/contact", zone_name = "2ndtolworth.org.uk" }
]

[vars]
# Production admin/private routes are protected by Cloudflare Access. The Worker
# prefers Cloudflare's authenticated ctx.access context. Optional TEAM_DOMAIN and
# POLICY_AUD remote variables are preserved as explicit pins for the legacy/raw-JWT
# fallback path rather than being required for normal Access-authenticated traffic.
REQUIRE_CF_ACCESS = "true"
SCOUTS_URL = "https://w6yfull3fisjxefw2lknyblezu0kbokv.lambda-url.eu-west-2.on.aws/"
IFTTT_EVENT_NAME = "scoutsContactForm"
