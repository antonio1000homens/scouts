<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Contact Us | 2nd Tolworth Scout Group</title>
    <meta name="description" content="Contact 2nd Tolworth Scout Group to ask about joining, volunteering, hall hire, or general enquiries using our online contact form.">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <link rel="canonical" href="https://2ndtolworth.org.uk/website/contact/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="2nd Tolworth Scout Group">
    <meta property="og:title" content="Contact Us | 2nd Tolworth Scout Group">
    <meta property="og:description" content="Get in touch with 2nd Tolworth Scout Group about joining, volunteering, hall hire, or general enquiries.">
    <meta property="og:url" content="https://2ndtolworth.org.uk/website/contact/">
    <meta property="og:image" content="https://2ndtolworth.org.uk/website/images/photos/three-cubs-jpg.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Contact Us | 2nd Tolworth Scout Group">
    <meta name="twitter:description" content="Get in touch with 2nd Tolworth Scout Group about joining, volunteering, hall hire, or general enquiries.">
    <meta name="twitter:image" content="https://2ndtolworth.org.uk/website/images/photos/three-cubs-jpg.jpg">
    <link rel="icon" href="../images/scouts-logo-white-png.png">
    <link rel="stylesheet" href="../fonts/fonts.css">
    <link rel="stylesheet" href="../styles.css?v=20260308-1">
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="contact contact-detail">
            <div class="container">
                <h2>Contact Us</h2>
                <div class="contact-content">
                    <div class="contact-info">
                        <h3>Get in Touch</h3>
                        <p>Interested in joining or want more information? We'd love to hear from you!</p>
                    </div>
                    <div class="contact-form">
                        <h3>Send us a message</h3>
                        <form id="contact-form" novalidate>
                            <input type="text" id="contact-name" name="name" placeholder="Your Name" required>
                            <input type="email" id="contact-email" name="email" placeholder="Your Email" required>
                            <textarea id="contact-message" name="message" placeholder="Your Message" rows="5" required></textarea>
                            <p class="contact-privacy-note">Your email will only be used to reply to your enquiry and will not be stored or used for any other purpose.</p>
                            <div class="cf-turnstile" data-sitekey="0x4AAAAAACoAfXmbmqTC8_Z-" data-theme="light"></div>
                            <div id="contact-status" class="contact-status" aria-live="polite" hidden></div>
                            <button type="submit" id="contact-submit">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="/website/scripts/header-loader.js"></script>
    <script src="/website/scripts/footer-loader.js"></script>
    <script src="/website/scripts/contact-form.js"></script>
</body>
</html>
