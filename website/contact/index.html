<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Contact Us | 2nd Tolworth Scout Group</title>
    <link rel="icon" href="../images/scouts-logo-white-png.png">
    <link rel="stylesheet" href="../fonts/fonts.css">
    <link rel="stylesheet" href="../styles.css?v=20260308-1">
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="contact contact-detail">
            <div class="container">
                <h2>Contact Us</h2>
                <div class="contact-content">
                    <div class="contact-info">
                        <h3>Get in Touch</h3>
                        <p>Interested in joining or want more information? We'd love to hear from you!</p>
                        <p><strong>Email:</strong> info@scoutgroup.org</p>
                        <p><strong>Phone:</strong> 01234 567890</p>
                    </div>
                    <div class="contact-form">
                        <h3>Send us a message</h3>
                        <form id="contact-form" novalidate>
                            <input type="text" id="contact-name" name="name" placeholder="Your Name" required>
                            <input type="email" id="contact-email" name="email" placeholder="Your Email" required>
                            <textarea id="contact-message" name="message" placeholder="Your Message" rows="5" required></textarea>
                            <div class="cf-turnstile" data-sitekey="0x4AAAAAACoAfXmbmqTC8_Z-" data-theme="light"></div>
                            <div id="contact-status" class="contact-status" aria-live="polite" hidden></div>
                            <button type="submit" id="contact-submit">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="/website/scripts/header-loader.js"></script>
    <script src="/website/scripts/footer-loader.js"></script>
    <script src="/website/scripts/contact-form.js"></script>
</body>
</html>
