<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | 2nd Tolworth Scout Group</title>
    <link rel="icon" href="../images/scouts-logo-white-png.png">
    <link rel="stylesheet" href="../fonts/fonts.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="contact contact-detail">
            <div class="container">
                <h2>Contact Us</h2>
                <div class="contact-content">
                    <div class="contact-info">
                        <h3>Get in Touch</h3>
                        <p>Interested in joining or want more information? We'd love to hear from you!</p>
                        <p><strong>Email:</strong> info@scoutgroup.org</p>
                        <p><strong>Phone:</strong> 01234 567890</p>
                    </div>
                    <div class="contact-form">
                        <h3>Send us a message</h3>
                        <form>
                            <input type="text" placeholder="Your Name" required>
                            <input type="email" placeholder="Your Email" required>
                            <textarea placeholder="Your Message" rows="5" required></textarea>
                            <button type="submit">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="current-year"></span> 2nd Tolworth Scout Group. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
    <script src="/website/scripts/header-loader.js"></script>
</body>
</html>
