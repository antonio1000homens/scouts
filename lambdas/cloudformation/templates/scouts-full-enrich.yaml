AWSTemplateFormatVersion: '2010-09-09'
Description: Scouts full enrichment Step Functions workflow (tagline -> imageTheme -> image)

Parameters:
  StateMachineName:
    Type: String
    Default: scouts-full-enrich-managed-poc
  RequestsQueueUrl:
    Type: String
    Default: https://sqs.eu-west-2.amazonaws.com/553490163883/scoutsRequests
  RequestsQueueArn:
    Type: String
    Default: arn:aws:sqs:eu-west-2:553490163883:scoutsRequests
  StageTimeoutSeconds:
    Type: Number
    Default: 900
    MinValue: 60

Resources:
  ScoutsFullEnrichRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${StateMachineName}-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DispatchScoutsRequests
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !Ref RequestsQueueArn

  ScoutsFullEnrichStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Ref StateMachineName
      StateMachineType: STANDARD
      RoleArn: !GetAtt ScoutsFullEnrichRole.Arn
      DefinitionString:
        !Sub |
          {
            "Comment": "One execution owns the normal Scouts enrichment sequence while DynamoDB remains authoritative for retry/cooldown/idempotency safety.",
            "StartAt": "DetermineStartingStage",
            "States": {
              "DetermineStartingStage": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.startStage",
                    "StringEquals": "complete",
                    "Next": "Complete"
                  },
                  {
                    "Variable": "$.startStage",
                    "StringEquals": "image",
                    "Next": "SelectImageProvider"
                  },
                  {
                    "Variable": "$.startStage",
                    "StringEquals": "imageTheme",
                    "Next": "GenerateImageTheme"
                  }
                ],
                "Default": "GenerateTagline"
              },
              "GenerateTagline": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::sqs:sendMessage.waitForTaskToken",
                "Parameters": {
                  "QueueUrl": "${RequestsQueueUrl}",
                  "MessageBody": {
                    "realm": "scoutsRequest",
                    "action": "request",
                    "subject": "tagline",
                    "subjectLabel": "tagline",
                    "source": "scouts-full-enrich",
                    "approvalMode.$": "$.approvalMode",
                    "requestMode.$": "$.requestMode",
                    "requestId.$": "$.requestId",
                    "requestHex.$": "$.requestHex",
                    "hex.$": "$.requestHex",
                    "orchestrationType": "fullEnrich",
                    "orchestrationStep": "tagline",
                    "taskToken.$": "$$.Task.Token"
                  }
                },
                "TimeoutSeconds": ${StageTimeoutSeconds},
                "ResultPath": "$.taglineResult",
                "Catch": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "ResultPath": "$.failure",
                    "Next": "UnexpectedFailure"
                  }
                ],
                "Next": "EvaluateTaglineResult"
              },
              "EvaluateTaglineResult": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.taglineResult.status",
                    "StringEquals": "succeeded",
                    "Next": "GenerateImageTheme"
                  },
                  {
                    "Variable": "$.taglineResult.status",
                    "StringEquals": "manual_review",
                    "Next": "ManualReview"
                  },
                  {
                    "Variable": "$.taglineResult.status",
                    "StringEquals": "retry_wait",
                    "Next": "Deferred"
                  },
                  {
                    "Variable": "$.taglineResult.status",
                    "StringEquals": "deferred",
                    "Next": "Deferred"
                  }
                ],
                "Default": "UnexpectedFailure"
              },
              "GenerateImageTheme": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::sqs:sendMessage.waitForTaskToken",
                "Parameters": {
                  "QueueUrl": "${RequestsQueueUrl}",
                  "MessageBody": {
                    "realm": "scoutsRequest",
                    "action": "request",
                    "subject": "imageTheme",
                    "subjectLabel": "imageTheme",
                    "source": "scouts-full-enrich",
                    "approvalMode.$": "$.approvalMode",
                    "requestMode.$": "$.requestMode",
                    "requestId.$": "$.requestId",
                    "requestHex.$": "$.requestHex",
                    "hex.$": "$.requestHex",
                    "orchestrationType": "fullEnrich",
                    "orchestrationStep": "imageTheme",
                    "taskToken.$": "$$.Task.Token"
                  }
                },
                "TimeoutSeconds": ${StageTimeoutSeconds},
                "ResultPath": "$.imageThemeResult",
                "Catch": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "ResultPath": "$.failure",
                    "Next": "UnexpectedFailure"
                  }
                ],
                "Next": "EvaluateImageThemeResult"
              },
              "EvaluateImageThemeResult": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.imageThemeResult.status",
                    "StringEquals": "succeeded",
                    "Next": "SelectImageProvider"
                  },
                  {
                    "Variable": "$.imageThemeResult.status",
                    "StringEquals": "manual_review",
                    "Next": "ManualReview"
                  },
                  {
                    "Variable": "$.imageThemeResult.status",
                    "StringEquals": "retry_wait",
                    "Next": "Deferred"
                  },
                  {
                    "Variable": "$.imageThemeResult.status",
                    "StringEquals": "deferred",
                    "Next": "Deferred"
                  }
                ],
                "Default": "UnexpectedFailure"
              },
              "SelectImageProvider": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.imageProvider",
                    "StringEquals": "cloudflare",
                    "Next": "GenerateImageCloudflare"
                  },
                  {
                    "Variable": "$.imageProvider",
                    "StringEquals": "gemini",
                    "Next": "GenerateImageGemini"
                  },
                  {
                    "Variable": "$.imageProvider",
                    "StringEquals": "disabled",
                    "Next": "ImageGenerationDisabled"
                  }
                ],
                "Default": "InvalidImageProvider"
              },
              "GenerateImageCloudflare": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::sqs:sendMessage.waitForTaskToken",
                "Parameters": {
                  "QueueUrl": "${RequestsQueueUrl}",
                  "MessageBody": {
                    "realm": "scoutsRequest",
                    "action": "request",
                    "subject": "imageUrl",
                    "subjectLabel": "imageUrl",
                    "source": "scouts-full-enrich",
                    "approvalMode.$": "$.approvalMode",
                    "requestMode.$": "$.requestMode",
                    "requestId.$": "$.requestId",
                    "requestHex.$": "$.requestHex",
                    "hex.$": "$.requestHex",
                    "orchestrationType": "fullEnrich",
                    "orchestrationStep": "image",
                    "imageProvider": "cloudflare",
                    "taskToken.$": "$$.Task.Token"
                  }
                },
                "TimeoutSeconds": ${StageTimeoutSeconds},
                "ResultPath": "$.imageResult",
                "Catch": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "ResultPath": "$.failure",
                    "Next": "UnexpectedFailure"
                  }
                ],
                "Next": "EvaluateImageResult"
              },
              "GenerateImageGemini": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::sqs:sendMessage.waitForTaskToken",
                "Parameters": {
                  "QueueUrl": "${RequestsQueueUrl}",
                  "MessageBody": {
                    "realm": "scoutsRequest",
                    "action": "request",
                    "subject": "imageUrl",
                    "subjectLabel": "imageUrl",
                    "source": "scouts-full-enrich",
                    "approvalMode.$": "$.approvalMode",
                    "requestMode.$": "$.requestMode",
                    "requestId.$": "$.requestId",
                    "requestHex.$": "$.requestHex",
                    "hex.$": "$.requestHex",
                    "orchestrationType": "fullEnrich",
                    "orchestrationStep": "image",
                    "imageProvider": "gemini",
                    "taskToken.$": "$$.Task.Token"
                  }
                },
                "TimeoutSeconds": ${StageTimeoutSeconds},
                "ResultPath": "$.imageResult",
                "Catch": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "ResultPath": "$.failure",
                    "Next": "UnexpectedFailure"
                  }
                ],
                "Next": "EvaluateImageResult"
              },
              "EvaluateImageResult": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.imageResult.status",
                    "StringEquals": "succeeded",
                    "Next": "Complete"
                  },
                  {
                    "Variable": "$.imageResult.status",
                    "StringEquals": "manual_review",
                    "Next": "ManualReview"
                  },
                  {
                    "Variable": "$.imageResult.status",
                    "StringEquals": "retry_wait",
                    "Next": "Deferred"
                  },
                  {
                    "Variable": "$.imageResult.status",
                    "StringEquals": "deferred",
                    "Next": "Deferred"
                  }
                ],
                "Default": "UnexpectedFailure"
              },
              "ImageGenerationDisabled": {
                "Type": "Succeed",
                "Comment": "Text enrichment may complete while image generation is deliberately disabled; no image provider is called."
              },
              "Deferred": {
                "Type": "Succeed",
                "Comment": "DynamoDB retry/cooldown state remains authoritative; scheduled reconciliation may start a later eligible execution."
              },
              "ManualReview": {
                "Type": "Succeed",
                "Comment": "Automatic provider work has been quarantined by the enrichment safety layer."
              },
              "InvalidImageProvider": {
                "Type": "Fail",
                "Error": "InvalidImageProvider",
                "Cause": "imageProvider must be cloudflare, gemini, or disabled"
              },
              "UnexpectedFailure": {
                "Type": "Fail",
                "Error": "FullEnrichStageFailed",
                "Cause": "A stage did not return a supported structured result or the callback task failed"
              },
              "Complete": {
                "Type": "Succeed"
              }
            }
          }

Outputs:
  StateMachineArn:
    Value: !Ref ScoutsFullEnrichStateMachine
    Description: ARN of the source-controlled production full-enrichment state machine
  RoleArn:
    Value: !GetAtt ScoutsFullEnrichRole.Arn
