AWSTemplateFormatVersion: '2010-09-09'
Description: Scouts full-enrich Step Functions state machine

Parameters:
  StateMachineName:
    Type: String
    Default: scouts-full-enrich
  ScoutsRequestsQueueUrl:
    Type: String
    Default: https://sqs.eu-west-2.amazonaws.com/553490163883/scoutsRequests
  ScoutsRequestsQueueArn:
    Type: String
    Default: arn:aws:sqs:eu-west-2:553490163883:scoutsRequests

Resources:
  ScoutsFullEnrichRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${StateMachineName}-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DispatchScoutsRequests
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !Ref ScoutsRequestsQueueArn

  ScoutsFullEnrichStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Ref StateMachineName
      RoleArn: !GetAtt ScoutsFullEnrichRole.Arn
      DefinitionString:
        !Sub |
          {
            "Comment": "Full enrichment workflow for new Scouts HEX records",
            "StartAt": "GenerateCoreMetadata",
            "States": {
              "GenerateCoreMetadata": {
                "Type": "Parallel",
                "Branches": [
                  {
                    "StartAt": "GenerateTagline",
                    "States": {
                      "GenerateTagline": {
                        "Type": "Task",
                        "Resource": "arn:${AWS::Partition}:states:::sqs:sendMessage.waitForTaskToken",
                        "Parameters": {
                          "QueueUrl": "${ScoutsRequestsQueueUrl}",
                          "MessageBody": {
                            "realm": "stateMachine",
                            "subject": "tagline",
                            "subjectLabel": "tagline",
                            "requestedField": "tagline",
                            "source": "scouts-full-enrich",
                            "approvalMode.$": "$.approvalMode",
                            "requestMode.$": "$.requestMode",
                            "requestId.$": "$.requestId",
                            "hexId.$": "$.hexId",
                            "requestHex.$": "$.requestHex",
                            "orchestrationType": "fullEnrich",
                            "orchestrationStep": "tagline",
                            "taskToken.$": "$$.Task.Token",
                            "action": "request"
                          }
                        },
                        "TimeoutSeconds": 900,
                        "ResultPath": "$.stageResults.tagline",
                        "Retry": [
                          {
                            "ErrorEquals": ["States.ALL"],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 2,
                            "BackoffRate": 2
                          }
                        ],
                        "End": true
                      }
                    }
                  },
                  {
                    "StartAt": "GenerateImageTheme",
                    "States": {
                      "GenerateImageTheme": {
                        "Type": "Task",
                        "Resource": "arn:${AWS::Partition}:states:::sqs:sendMessage.waitForTaskToken",
                        "Parameters": {
                          "QueueUrl": "${ScoutsRequestsQueueUrl}",
                          "MessageBody": {
                            "realm": "stateMachine",
                            "subject": "imageTheme",
                            "subjectLabel": "imageTheme",
                            "requestedField": "imageTheme",
                            "source": "scouts-full-enrich",
                            "approvalMode.$": "$.approvalMode",
                            "requestMode.$": "$.requestMode",
                            "requestId.$": "$.requestId",
                            "hexId.$": "$.hexId",
                            "requestHex.$": "$.requestHex",
                            "orchestrationType": "fullEnrich",
                            "orchestrationStep": "imageTheme",
                            "taskToken.$": "$$.Task.Token",
                            "action": "request"
                          }
                        },
                        "TimeoutSeconds": 900,
                        "ResultPath": "$.stageResults.imageTheme",
                        "Retry": [
                          {
                            "ErrorEquals": ["States.ALL"],
                            "IntervalSeconds": 2,
                            "MaxAttempts": 2,
                            "BackoffRate": 2
                          }
                        ],
                        "End": true
                      }
                    }
                  }
                ],
                "ResultPath": "$.stageResults.coreMetadata",
                "Next": "GenerateImage"
              },
              "GenerateImage": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::sqs:sendMessage.waitForTaskToken",
                "Parameters": {
                  "QueueUrl": "${ScoutsRequestsQueueUrl}",
                  "MessageBody": {
                    "realm": "stateMachine",
                    "subject": "imageUrl",
                    "subjectLabel": "imageUrl",
                    "requestedField": "imageUrl",
                    "source": "scouts-full-enrich",
                    "approvalMode.$": "$.approvalMode",
                    "requestMode.$": "$.requestMode",
                    "requestId.$": "$.requestId",
                    "hexId.$": "$.hexId",
                    "requestHex.$": "$.requestHex",
                    "orchestrationType": "fullEnrich",
                    "orchestrationStep": "image",
                    "taskToken.$": "$$.Task.Token",
                    "action": "request"
                  }
                },
                "TimeoutSeconds": 900,
                "ResultPath": "$.stageResults.image",
                "Retry": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "IntervalSeconds": 2,
                    "MaxAttempts": 2,
                    "BackoffRate": 2
                  }
                ],
                "Next": "PersistFinalEvent"
              },
              "PersistFinalEvent": {
                "Type": "Task",
                "Resource": "arn:${AWS::Partition}:states:::sqs:sendMessage.waitForTaskToken",
                "Parameters": {
                  "QueueUrl": "${ScoutsRequestsQueueUrl}",
                  "MessageBody": {
                    "realm": "stateMachine",
                    "subject": "persist",
                    "subjectLabel": "persist",
                    "requestedField": "persist",
                    "source": "scouts-full-enrich",
                    "approvalMode.$": "$.approvalMode",
                    "requestMode.$": "$.requestMode",
                    "requestId.$": "$.requestId",
                    "hexId.$": "$.hexId",
                    "requestHex.$": "$.requestHex",
                    "orchestrationType": "fullEnrich",
                    "orchestrationStep": "persist",
                    "taskToken.$": "$$.Task.Token",
                    "action": "persist"
                  }
                },
                "TimeoutSeconds": 900,
                "ResultPath": "$.stageResults.persist",
                "Retry": [
                  {
                    "ErrorEquals": ["States.ALL"],
                    "IntervalSeconds": 2,
                    "MaxAttempts": 2,
                    "BackoffRate": 2
                  }
                ],
                "End": true
              }
            }
          }

Outputs:
  StateMachineArn:
    Value: !Ref ScoutsFullEnrichStateMachine
  RoleArn:
    Value: !GetAtt ScoutsFullEnrichRole.Arn
