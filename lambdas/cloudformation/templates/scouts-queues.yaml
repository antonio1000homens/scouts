AWSTemplateFormatVersion: '2010-09-09'
Description: Scouts SQS queues for the dedicated Scouts AWS account.

Parameters:
  RequestsQueueName:
    Type: String
    Default: scoutsRequests
  RequestsDlqName:
    Type: String
    Default: scoutsRequestsDLQ
  ProcessingQueueName:
    Type: String
    Default: scoutsProcessing
  DecisionQueueName:
    Type: String
    Default: scoutsDecision
  ProcessingDlqName:
    Type: String
    Default: scoutsProcessingDLQ
  RequestsVisibilityTimeout:
    Type: Number
    Default: 600
  ProcessingVisibilityTimeout:
    Type: Number
    Default: 60
  DlqVisibilityTimeout:
    Type: Number
    Default: 600
  MessageRetentionSeconds:
    Type: Number
    Default: 1209600
  RequestsMaxReceiveCount:
    Type: Number
    Default: 5
  ProcessingMaxReceiveCount:
    Type: Number
    Default: 3

Resources:
  ScoutsRequestsDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref RequestsDlqName
      VisibilityTimeout: !Ref DlqVisibilityTimeout
      MessageRetentionPeriod: !Ref MessageRetentionSeconds

  ScoutsProcessingDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref ProcessingDlqName
      VisibilityTimeout: !Ref DlqVisibilityTimeout
      MessageRetentionPeriod: !Ref MessageRetentionSeconds

  ScoutsRequestsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref RequestsQueueName
      VisibilityTimeout: !Ref RequestsVisibilityTimeout
      MessageRetentionPeriod: !Ref MessageRetentionSeconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScoutsRequestsDlq.Arn
        maxReceiveCount: !Ref RequestsMaxReceiveCount

  ScoutsDecisionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref DecisionQueueName
      VisibilityTimeout: !Ref RequestsVisibilityTimeout
      MessageRetentionPeriod: !Ref MessageRetentionSeconds

  ScoutsProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Ref ProcessingQueueName
      VisibilityTimeout: !Ref ProcessingVisibilityTimeout
      MessageRetentionPeriod: !Ref MessageRetentionSeconds
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScoutsProcessingDlq.Arn
        maxReceiveCount: !Ref ProcessingMaxReceiveCount

Outputs:
  ScoutsRequestsQueueArn:
    Value: !GetAtt ScoutsRequestsQueue.Arn
  ScoutsRequestsQueueUrl:
    Value: !Ref ScoutsRequestsQueue
  ScoutsRequestsDlqArn:
    Value: !GetAtt ScoutsRequestsDlq.Arn
  ScoutsRequestsDlqUrl:
    Value: !Ref ScoutsRequestsDlq
  ScoutsProcessingQueueArn:
    Value: !GetAtt ScoutsProcessingQueue.Arn
  ScoutsProcessingQueueUrl:
    Value: !Ref ScoutsProcessingQueue
  ScoutsDecisionQueueArn:
    Value: !GetAtt ScoutsDecisionQueue.Arn
  ScoutsDecisionQueueUrl:
    Value: !Ref ScoutsDecisionQueue
  ScoutsProcessingDlqArn:
    Value: !GetAtt ScoutsProcessingDlq.Arn
  ScoutsProcessingDlqUrl:
    Value: !Ref ScoutsProcessingDlq
