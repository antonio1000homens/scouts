AWSTemplateFormatVersion: '2010-09-09'
Description: sqs2scouts Lambda stack (function + layer + IAM + SQS event source mapping)

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket that stores Lambda artifacts.
  FunctionCodeKey:
    Type: String
    Description: S3 key for function zip.
  LayerCodeKey:
    Type: String
    Description: S3 key for layer zip.
  FunctionName:
    Type: String
    Default: sqs2scouts
  LayerName:
    Type: String
    Default: scouts-shared
  RoleName:
    Type: String
    Default: sqs2scouts-lambda-role
  Runtime:
    Type: String
    Default: nodejs24.x
  Handler:
    Type: String
    Default: full-enrich-adapter.lambdaHandler
  Timeout:
    Type: Number
    Default: 90
  MemorySize:
    Type: Number
    Default: 256
  QueueArn:
    Type: String
    Description: SQS queue ARN used as event source.
  ScoutsDecisionQueueArn:
    Type: String
    Default: arn:aws:sqs:eu-west-2:553490163883:scoutsDecision
  ScoutsDecisionQueueUrl:
    Type: String
    Default: https://sqs.eu-west-2.amazonaws.com/553490163883/scoutsDecision
  DlqArn:
    Type: String
    Default: arn:aws:sqs:eu-west-2:553490163883:scoutsProcessingDLQ
  DlqUrl:
    Type: String
    Default: https://sqs.eu-west-2.amazonaws.com/553490163883/scoutsProcessingDLQ
  ProcessingQueueUrl:
    Type: String
    Default: https://sqs.eu-west-2.amazonaws.com/553490163883/scoutsProcessing
  BatchSize:
    Type: Number
    Default: 1
  SlackSigningSecretParameter:
    Type: String
    Default: /scouts/shared/slack-signing-secret
  SlackBotTokenParameter:
    Type: String
    Default: /scouts/shared/slack-bot-token
  GeminiApiKeyParameter:
    Type: String
    Default: /scouts/sqs2scouts/gemini-api-key
  GeminiApiVersion:
    Type: String
    Default: ''
  GeminiImageApiVersion:
    Type: String
    Default: ''
  GeminiImageModel:
    Type: String
    Default: ''
  GeminiTextModel:
    Type: String
    Default: ''
  GeminiEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  GeminiImagesEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  GeminiDailyRequestLimit:
    Type: Number
    Default: 10
    MinValue: 0
  GeminiUsageTableName:
    Type: String
    Default: scouts-gemini-usage
  GeminiEnrichmentStateTableName:
    Type: String
    Default: scouts-enrichment-state
  GeminiMaxAttemptsPerStage:
    Type: Number
    Default: 3
    MinValue: 1
  GeminiRetryDelayAttempt2Seconds:
    Type: Number
    Default: 3600
    MinValue: 0
  GeminiRetryDelayAttempt3Seconds:
    Type: Number
    Default: 21600
    MinValue: 0
  GeminiInProgressLeaseSeconds:
    Type: Number
    Default: 1800
    MinValue: 60
  GeminiPromptVersion:
    Type: String
    Default: '1'
  ImageGenerationDailyRequestLimit:
    Type: Number
    Default: 10
    MinValue: 0
  CloudflareAccountId:
    Type: String
    Default: ''
  CloudflareAiApiTokenParameter:
    Type: String
    Default: /scouts/sqs2scouts/cloudflare-ai-api-token
  CloudflareAiModel:
    Type: String
    Default: '@cf/black-forest-labs/flux-1-schnell'
  CloudflareAiSteps:
    Type: Number
    Default: 4
    MinValue: 1
    MaxValue: 8
  SlackWebhookUrl:
    Type: String
    Default: https://slack.com/api/chat.postMessage
  Scouts2SqsFunctionUrl:
    Type: String
    Default: ''
  TargetBucket:
    Type: String
    Default: scouts-2ndtolworth-prod-553490163883
  S3WebsiteBaseUrl:
    Type: String
    Default: https://scouts-2ndtolworth-prod-553490163883.s3.eu-west-2.amazonaws.com
  ScoutsConfigKey:
    Type: String
    Default: scouts.conf
  ApprovalMetadataPrefix:
    Type: String
    Default: approvals

Resources:
  GeminiUsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref GeminiUsageTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: usageDay
          AttributeType: S
        - AttributeName: usageScope
          AttributeType: S
      KeySchema:
        - AttributeName: usageDay
          KeyType: HASH
        - AttributeName: usageScope
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  GeminiEnrichmentStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref GeminiEnrichmentStateTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: hex
          AttributeType: S
        - AttributeName: stage
          AttributeType: S
      KeySchema:
        - AttributeName: hex
          KeyType: HASH
        - AttributeName: stage
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  Sqs2ScoutsLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Ref LayerName
      CompatibleRuntimes:
        - !Ref Runtime
      Content:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref LayerCodeKey

  Sqs2ScoutsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SQS2ScoutsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !Ref QueueArn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !Ref ScoutsDecisionQueueArn
                  - !Ref DlqArn
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub arn:aws:s3:::${TargetBucket}
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:aws:s3:::${TargetBucket}/*
              - Effect: Allow
                Action:
                  - states:SendTaskSuccess
                  - states:SendTaskFailure
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt GeminiUsageTable.Arn
                  - !GetAtt GeminiEnrichmentStateTable.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scouts/shared/slack-signing-secret
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scouts/shared/slack-bot-token
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scouts/sqs2scouts/gemini-api-key
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CloudflareAiApiTokenParameter}

  Sqs2ScoutsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: !Ref Runtime
      Handler: !Ref Handler
      Role: !GetAtt Sqs2ScoutsRole.Arn
      Timeout: !Ref Timeout
      MemorySize: !Ref MemorySize
      Layers:
        - !Ref Sqs2ScoutsLayer
      Environment:
        Variables:
          SLACK_SIGNING_SECRET_PARAMETER: !Ref SlackSigningSecretParameter
          SLACK_BOT_TOKEN_PARAMETER: !Ref SlackBotTokenParameter
          GEMINI_API_KEY_PARAMETER: !Ref GeminiApiKeyParameter
          GEMINI_API_VERSION: !Ref GeminiApiVersion
          GEMINI_IMAGE_API_VERSION: !Ref GeminiImageApiVersion
          GEMINI_IMAGE_MODEL: !Ref GeminiImageModel
          GEMINI_TEXT_MODEL: !Ref GeminiTextModel
          GEMINI: !Ref GeminiEnabled
          GEMINI_IMAGES: !Ref GeminiImagesEnabled
          GEMINI_DAILY_REQUEST_LIMIT: !Ref GeminiDailyRequestLimit
          GEMINI_USAGE_TABLE_NAME: !Ref GeminiUsageTableName
          GEMINI_ENRICHMENT_STATE_TABLE_NAME: !Ref GeminiEnrichmentStateTableName
          GEMINI_MAX_ATTEMPTS_PER_STAGE: !Ref GeminiMaxAttemptsPerStage
          GEMINI_RETRY_DELAY_ATTEMPT_2_SECONDS: !Ref GeminiRetryDelayAttempt2Seconds
          GEMINI_RETRY_DELAY_ATTEMPT_3_SECONDS: !Ref GeminiRetryDelayAttempt3Seconds
          GEMINI_IN_PROGRESS_LEASE_SECONDS: !Ref GeminiInProgressLeaseSeconds
          GEMINI_PROMPT_VERSION: !Ref GeminiPromptVersion
          IMAGE_GENERATION_DAILY_REQUEST_LIMIT: !Ref ImageGenerationDailyRequestLimit
          CLOUDFLARE_ACCOUNT_ID: !Ref CloudflareAccountId
          CLOUDFLARE_AI_API_TOKEN_PARAMETER: !Ref CloudflareAiApiTokenParameter
          CLOUDFLARE_AI_MODEL: !Ref CloudflareAiModel
          CLOUDFLARE_AI_STEPS: !Ref CloudflareAiSteps
          SLACK_WEBHOOK_URL: !Ref SlackWebhookUrl
          SCOUTS2SQS_FUNCTION_URL: !Ref Scouts2SqsFunctionUrl
          SCOUTS_DECISION_QUEUE_URL: !Ref ScoutsDecisionQueueUrl
          SCOUTS_PROCESSING_QUEUE_URL: !Ref ProcessingQueueUrl
          DLQ_URL: !Ref DlqUrl
          TARGET_BUCKET: !Ref TargetBucket
          SCOUTS_CONFIG_KEY: !Ref ScoutsConfigKey
          APPROVAL_METADATA_PREFIX: !Ref ApprovalMetadataPrefix
          S3_WEBSITE_BASE_URL: !Ref S3WebsiteBaseUrl
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref FunctionCodeKey

  Sqs2ScoutsEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref Sqs2ScoutsFunction
      EventSourceArn: !Ref QueueArn
      BatchSize: !Ref BatchSize
      Enabled: true

  GeminiQuotaRejectedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: scouts-gemini-daily-limit-reached
      AlarmDescription: Gemini requests were blocked by the Scouts daily safety limit.
      Namespace: Scouts/Gemini
      MetricName: Requests
      Dimensions:
        - Name: Outcome
          Value: quota_rejected
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  GeminiFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: scouts-gemini-request-failed
      AlarmDescription: A Scouts Gemini request failed after the external request was attempted.
      Namespace: Scouts/Gemini
      MetricName: Requests
      Dimensions:
        - Name: Outcome
          Value: failure
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  GeminiEnrichmentQuarantineAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: scouts-gemini-enrichment-quarantined
      AlarmDescription: A HEX and enrichment stage entered manual review after bounded retries or a permanent error.
      Namespace: Scouts/Gemini
      MetricName: EnrichmentQuarantined
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  GeminiEnrichmentRetryBurstAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: scouts-gemini-enrichment-retry-burst
      AlarmDescription: Unexpected Gemini enrichment retries in the last hour.
      Namespace: Scouts/Gemini
      MetricName: EnrichmentRetry
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  FunctionArn:
    Value: !GetAtt Sqs2ScoutsFunction.Arn
  LayerVersionArn:
    Value: !Ref Sqs2ScoutsLayer
  EventSourceMappingId:
    Value: !Ref Sqs2ScoutsEventSourceMapping
  GeminiUsageTableName:
    Value: !Ref GeminiUsageTable
  GeminiEnrichmentStateTableName:
    Value: !Ref GeminiEnrichmentStateTable
