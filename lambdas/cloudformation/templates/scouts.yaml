AWSTemplateFormatVersion: '2010-09-09'
Description: Scouts Lambda stack (function + shared layer reference + IAM + optional S3 bucket + function URL)

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket that stores Lambda artifacts.
  FunctionCodeKey:
    Type: String
    Description: S3 key for scouts function zip.
  SharedLayerVersionArn:
    Type: String
    Default: ''
    Description: Centrally published scouts-shared Lambda layer version ARN.
  LayerCodeKey:
    Type: String
    Default: ''
    Description: Deprecated compatibility alias carrying the resolved shared layer ARN.
  LayerName:
    Type: String
    Default: scouts-shared
    Description: Deprecated compatibility parameter; layer publication is centrally owned.
  FunctionName:
    Type: String
    Default: scouts
  RoleName:
    Type: String
    Default: scouts-lambda-role
  Runtime:
    Type: String
    Default: nodejs24.x
  Handler:
    Type: String
    Default: scouts-entry.handler
  DataBucketName:
    Type: String
    Default: scouts-2ndtolworth-prod-553490163883
  CreateDataBucket:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
  FunctionUrlAuthType:
    Type: String
    AllowedValues:
      - NONE
      - AWS_IAM
    Default: NONE
  FunctionUrlCorsAllowOrigins:
    Type: CommaDelimitedList
    Default: https://2ndtolworth.org.uk
  FunctionUrlCorsAllowMethods:
    Type: CommaDelimitedList
    Default: GET,POST
  FunctionUrlCorsAllowHeaders:
    Type: CommaDelimitedList
    Default: content-type,x-api-key,x-requested-with
  FunctionUrlCorsMaxAge:
    Type: Number
    Default: 3600
  MemorySize:
    Type: Number
    Default: 256
  Timeout:
    Type: Number
    Default: 30
  RequiredApiKeyParameter:
    Type: String
    Default: /scouts/shared/required-api-key
  CubsEventsCalendarUrl:
    Type: String
    Default: ''
    NoEcho: true
  CubsProgrammeCalendarUrl:
    Type: String
    Default: ''
    NoEcho: true
  ScoutsEventsCalendarUrl:
    Type: String
    Default: ''
    NoEcho: true
  ScoutsProgrammeCalendarUrl:
    Type: String
    Default: ''
    NoEcho: true
  BeaversEventsCalendarUrl:
    Type: String
    Default: ''
    NoEcho: true
  BeaversProgrammeCalendarUrl:
    Type: String
    Default: ''
    NoEcho: true
  ScoutsRequestsQueueArn:
    Type: String
    Default: arn:aws:sqs:eu-west-2:553490163883:scoutsRequests
  ScoutsRequestsQueueUrl:
    Type: String
    Default: https://sqs.eu-west-2.amazonaws.com/553490163883/scoutsRequests
  Scouts2SqsFunctionUrl:
    Type: String
    Default: ''
  FullEnrichStateMachineArn:
    Type: String
    Default: ''
  GeminiUsageTableName:
    Type: String
    Default: scouts-gemini-usage
  GeminiEnrichmentStateTableName:
    Type: String
    Default: scouts-enrichment-state
  ScheduledRefreshExpression:
    Type: String
    Default: rate(30 minutes)
    Description: EventBridge cadence for automatic calendar/agenda refresh.
  ScheduledRefreshDefaultEnabled:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: Used only until the admin writes an explicit scheduled-refresh preference to S3.
  ScheduledRefreshMaxEvents:
    Type: Number
    Default: 0
    MinValue: 0
    Description: Maximum new enrichment queue publications per scheduled refresh. Zero keeps scheduled refresh discovery-only.
  ScheduledRefreshConfigKey:
    Type: String
    Default: runtime/scheduledRefresh.json

Conditions:
  ShouldCreateDataBucket: !Equals [!Ref CreateDataBucket, 'true']
  IsPublicFunctionUrl: !Equals [!Ref FunctionUrlAuthType, 'NONE']
  HasFullEnrichStateMachineArn: !Not [!Equals [!Ref FullEnrichStateMachineArn, '']]
  HasSharedLayerVersionArn: !Not [!Equals [!Ref SharedLayerVersionArn, '']]

Resources:
  ScoutsDataBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateDataBucket
    Properties:
      BucketName: !Ref DataBucketName

  ScoutsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ScoutsS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub arn:aws:s3:::${DataBucketName}
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub arn:aws:s3:::${DataBucketName}/*
              # Normal Scouts ingress publishes only to scoutsRequests.
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !Ref ScoutsRequestsQueueArn
              - Effect: Allow
                Action:
                  - sqs:GetQueueAttributes
                Resource:
                  - !Ref ScoutsRequestsQueueArn
                  - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:scoutsProcessing
                  - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:scoutsRequestsDLQ
                  - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:scoutsProcessingDLQ
              # StartMessageMoveTask requires Receive/Delete/GetAttributes on the
              # DLQ plus SendMessage on its destination queue. These permissions
              # are for explicit admin redrive, not normal application publishing.
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:StartMessageMoveTask
                Resource:
                  - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:scoutsRequestsDLQ
                  - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:scoutsProcessingDLQ
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !Ref ScoutsRequestsQueueArn
                  - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:scoutsProcessing
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${GeminiUsageTableName}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${GeminiEnrichmentStateTableName}
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scouts/shared/required-api-key
              - !If
                - HasFullEnrichStateMachineArn
                - Effect: Allow
                  Action:
                    - states:ListExecutions
                  Resource: !Ref FullEnrichStateMachineArn
                - !Ref AWS::NoValue
              - !If
                - HasFullEnrichStateMachineArn
                - Effect: Allow
                  Action:
                    - states:DescribeExecution
                    - states:GetExecutionHistory
                  Resource: !Sub
                    - arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${FullEnrichStateMachineName}:*
                    - FullEnrichStateMachineName: !Select [6, !Split [':', !Ref FullEnrichStateMachineArn]]
                - !Ref AWS::NoValue

  ScoutsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: !Ref Runtime
      Handler: !Ref Handler
      Role: !GetAtt ScoutsLambdaRole.Arn
      Timeout: !Ref Timeout
      MemorySize: !Ref MemorySize
      Layers:
        - !If [HasSharedLayerVersionArn, !Ref SharedLayerVersionArn, !Ref LayerCodeKey]
      Environment:
        Variables:
          REQUIRED_API_KEY_PARAMETER: !Ref RequiredApiKeyParameter
          CUBS_EVENTS_CALENDAR_URL: !Ref CubsEventsCalendarUrl
          CUBS_PROGRAMME_CALENDAR_URL: !Ref CubsProgrammeCalendarUrl
          SCOUTS_EVENTS_CALENDAR_URL: !Ref ScoutsEventsCalendarUrl
          SCOUTS_PROGRAMME_CALENDAR_URL: !Ref ScoutsProgrammeCalendarUrl
          BEAVERS_EVENTS_CALENDAR_URL: !Ref BeaversEventsCalendarUrl
          BEAVERS_PROGRAMME_CALENDAR_URL: !Ref BeaversProgrammeCalendarUrl
          TARGET_BUCKET: !Ref DataBucketName
          SCOUTS_REQUESTS_QUEUE_URL: !Ref ScoutsRequestsQueueUrl
          SCOUTS2SQS_FUNCTION_URL: !Ref Scouts2SqsFunctionUrl
          FULL_ENRICH_STATE_MACHINE_ARN: !Ref FullEnrichStateMachineArn
          GEMINI_ENRICHMENT_STATE_TABLE_NAME: !Ref GeminiEnrichmentStateTableName
          SCOUTS_SCHEDULE_EXPRESSION: !Ref ScheduledRefreshExpression
          SCOUTS_SCHEDULED_REFRESH_DEFAULT_ENABLED: !Ref ScheduledRefreshDefaultEnabled
          SCOUTS_SCHEDULED_REFRESH_MAX_EVENTS: !Ref ScheduledRefreshMaxEvents
          SCOUTS_SCHEDULED_REFRESH_CONFIG_KEY: !Ref ScheduledRefreshConfigKey
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref FunctionCodeKey

  ScoutsScheduledRefreshRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Scheduled refresh of all configured Scout calendar feeds and agenda state.
      ScheduleExpression: !Ref ScheduledRefreshExpression
      State: ENABLED
      Targets:
        - Arn: !GetAtt ScoutsFunction.Arn
          Id: ScoutsScheduledRefresh
          Input: '{"_scheduledRefresh":true}'

  ScoutsScheduledRefreshInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ScoutsFunction
      Principal: events.amazonaws.com
      Action: lambda:InvokeFunction
      SourceArn: !GetAtt ScoutsScheduledRefreshRule.Arn

  ScoutsFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: !Ref FunctionUrlAuthType
      TargetFunctionArn: !Ref ScoutsFunction
      Cors:
        AllowOrigins: !Ref FunctionUrlCorsAllowOrigins
        AllowMethods: !Ref FunctionUrlCorsAllowMethods
        AllowHeaders: !Ref FunctionUrlCorsAllowHeaders
        MaxAge: !Ref FunctionUrlCorsMaxAge

  ScoutsUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: IsPublicFunctionUrl
    Properties:
      FunctionName: !Ref ScoutsFunction
      Principal: '*'
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: NONE

  ScoutsInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Condition: IsPublicFunctionUrl
    Properties:
      FunctionName: !Ref ScoutsFunction
      Principal: '*'
      Action: lambda:InvokeFunction
      InvokedViaFunctionUrl: true

Outputs:
  FunctionArn:
    Value: !GetAtt ScoutsFunction.Arn
  FunctionUrl:
    Value: !GetAtt ScoutsFunctionUrl.FunctionUrl
  LayerVersionArn:
    Value: !If [HasSharedLayerVersionArn, !Ref SharedLayerVersionArn, !Ref LayerCodeKey]
  DataBucket:
    Value: !Ref DataBucketName
  ScheduledRefreshRuleArn:
    Value: !GetAtt ScoutsScheduledRefreshRule.Arn
  ScheduledRefreshExpression:
    Value: !Ref ScheduledRefreshExpression
