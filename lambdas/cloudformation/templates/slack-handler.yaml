AWSTemplateFormatVersion: '2010-09-09'
Description: Slack handler Lambda stack (function + shared layer reference + IAM + function URL)

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket that stores Lambda artifacts.
  FunctionCodeKey:
    Type: String
    Description: S3 key for function zip.
  SharedLayerVersionArn:
    Type: String
    Default: ''
    Description: Centrally published scouts-shared Lambda layer version ARN.
  LayerCodeKey:
    Type: String
    Default: ''
    Description: Deprecated compatibility alias carrying the resolved shared layer ARN.
  LayerName:
    Type: String
    Default: scouts-shared
    Description: Deprecated compatibility parameter; layer publication is centrally owned.
  FunctionName:
    Type: String
    Default: scouts-slack-handler
  RoleArn:
    Type: String
    Default: ''
    Description: Optional existing IAM role ARN. If blank, a role is created.
  RoleName:
    Type: String
    Default: scouts-slack-handler-lambda-role
    Description: Role name used only when RoleArn is not provided.
  Runtime:
    Type: String
    Default: nodejs24.x
  Handler:
    Type: String
    Default: slack-handler-proxy.lambdaHandler
  Timeout:
    Type: Number
    Default: 30
  MemorySize:
    Type: Number
    Default: 256
  FunctionUrlAuthType:
    Type: String
    AllowedValues:
      - NONE
      - AWS_IAM
    Default: NONE
  SlackSigningSecretParameter:
    Type: String
    Default: /scouts/shared/slack-signing-secret
  SlackBotTokenParameter:
    Type: String
    Default: /scouts/shared/slack-bot-token
  RequiredApiKeyParameter:
    Type: String
    Default: /scouts/shared/required-api-key
  ScoutsRequestQueueUrl:
    Type: String
    Default: https://sqs.eu-west-2.amazonaws.com/553490163883/scoutsRequests
  ScoutsRequestQueueArn:
    Type: String
    Default: arn:aws:sqs:eu-west-2:553490163883:scoutsRequests
  NfcQueueUrl:
    Type: String
    Default: https://sqs.eu-west-2.amazonaws.com/553490163883/scoutsRequests
  NfcQueueArn:
    Type: String
    Default: arn:aws:sqs:eu-west-2:553490163883:scoutsRequests
  TargetBucket:
    Type: String
    Default: scouts-2ndtolworth-prod-553490163883
  ScoutsConfigKey:
    Type: String
    Default: scouts.conf

Conditions:
  UseProvidedRole: !Not [!Equals [!Ref RoleArn, '']]
  CreateRole: !Equals [!Ref RoleArn, '']
  IsPublicFunctionUrl: !Equals [!Ref FunctionUrlAuthType, 'NONE']
  HasSharedLayerVersionArn: !Not [!Equals [!Ref SharedLayerVersionArn, '']]

Resources:
  SlackHandlerRole:
    Type: AWS::IAM::Role
    Condition: CreateRole
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SlackHandlerSqsSendAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !Ref ScoutsRequestQueueArn
                  - !Ref NfcQueueArn
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${TargetBucket}/events/*
                  - !Sub arn:aws:s3:::${TargetBucket}/${ScoutsConfigKey}
                  - !Sub arn:aws:s3:::${TargetBucket}/runtime/approval-idempotency/*
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub arn:aws:s3:::${TargetBucket}/runtime/approval-idempotency/*
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scouts/shared/slack-signing-secret
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scouts/shared/slack-bot-token
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/scouts/shared/required-api-key

  SlackHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: !Ref Runtime
      Handler: !Ref Handler
      Role: !If [UseProvidedRole, !Ref RoleArn, !GetAtt SlackHandlerRole.Arn]
      Timeout: !Ref Timeout
      MemorySize: !Ref MemorySize
      Layers:
        - !If [HasSharedLayerVersionArn, !Ref SharedLayerVersionArn, !Ref LayerCodeKey]
      Environment:
        Variables:
          SLACK_SIGNING_SECRET_PARAMETER: !Ref SlackSigningSecretParameter
          SLACK_BOT_TOKEN_PARAMETER: !Ref SlackBotTokenParameter
          REQUIRED_API_KEY_PARAMETER: !Ref RequiredApiKeyParameter
          SCOUTS_REQUEST_QUEUE_URL: !Ref ScoutsRequestQueueUrl
          NFC_QUEUE_URL: !Ref NfcQueueUrl
          TARGET_BUCKET: !Ref TargetBucket
          SCOUTS_CONFIG_KEY: !Ref ScoutsConfigKey
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref FunctionCodeKey

  SlackHandlerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref SlackHandlerFunction
      AuthType: !Ref FunctionUrlAuthType
      Cors:
        AllowCredentials: false
        AllowHeaders:
          - '*'
        AllowMethods:
          - '*'
        AllowOrigins:
          - '*'
        ExposeHeaders:
          - '*'
        MaxAge: 86400

  SlackHandlerUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: IsPublicFunctionUrl
    Properties:
      FunctionName: !Ref SlackHandlerFunction
      Principal: '*'
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: NONE

  SlackHandlerInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Condition: IsPublicFunctionUrl
    Properties:
      FunctionName: !Ref SlackHandlerFunction
      Principal: '*'
      Action: lambda:InvokeFunction
      InvokedViaFunctionUrl: true

Outputs:
  FunctionArn:
    Value: !GetAtt SlackHandlerFunction.Arn
  FunctionUrl:
    Value: !GetAtt SlackHandlerFunctionUrl.FunctionUrl
  LayerVersionArn:
    Value: !If [HasSharedLayerVersionArn, !Ref SharedLayerVersionArn, !Ref LayerCodeKey]
  EffectiveRoleArn:
    Value: !If [UseProvidedRole, !Ref RoleArn, !GetAtt SlackHandlerRole.Arn]
